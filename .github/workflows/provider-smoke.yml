name: Provider Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: NVIDIA hosted model ID to probe
        required: true
        default: nvidia/nemotron-3-super-120b-a12b
        type: string
      scope:
        description: Smoke scope
        required: true
        default: full
        type: choice
        options:
          - baseline
          - full
          - codex

permissions:
  contents: read

jobs:
  nvidia-hosted:
    name: nvidia-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate Doppler bootstrap token
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "DOPPLER_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@12f29f902bf9279a3888501b9d27ba9f968a07c2 # v4.0.1

      - name: Fetch NVIDIA credential from Doppler
        id: doppler
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          value="$(doppler secrets get NVIDIA_API_KEY --plain --project oaslananka-ops --config runtime)"
          if [ -z "$value" ]; then
            echo "NVIDIA_API_KEY was not returned by Doppler." >&2
            exit 1
          fi
          echo "::add-mask::$value"
          printf 'NVIDIA_API_KEY=%s\n' "$value" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Probe Chat Completions
        if: ${{ inputs.scope == 'full' || inputs.scope == 'baseline' }}
        id: chat
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/chat/completions' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 16, "stream": False}))')")"

          echo "chat_completions_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("chat_completions_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("chat_completions_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("chat_completions_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(data.get("choices"), list):
              raise SystemExit("Chat Completions response is missing choices[]")
          print("chat_completions_schema=ok")
          PY

      - name: Probe Responses API
        if: ${{ inputs.scope == 'full' }}
        id: responses
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/responses' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "input": "Reply only with OK", "max_output_tokens": 16, "stream": False}))')")"

          echo "responses_http=${status}"
          if [[ "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("object") != "response" and not isinstance(data.get("output"), list):
              raise SystemExit("Responses API returned an unexpected schema")
          print("responses_schema=ok")
          PY
            echo "responses_supported=true" >> "$GITHUB_OUTPUT"
          else
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("responses_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("responses_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("responses_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            echo "responses_supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Anthropic Messages API
        if: ${{ inputs.scope == 'full' }}
        id: messages
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/messages' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 16, "stream": False}))')")"

          echo "messages_http=${status}"
          if [[ "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("type") != "message" and not isinstance(data.get("content"), list):
              raise SystemExit("Messages API returned an unexpected schema")
          print("messages_schema=ok")
          PY
            echo "messages_supported=true" >> "$GITHUB_OUTPUT"
          else
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("messages_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("messages_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("messages_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            echo "messages_supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe AgentInterposer Responses passthrough
        if: ${{ inputs.scope == 'full' }}
        id: gateway
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer"
          log="$RUNNER_TEMP/agentinterposer.log"
          body="$(mktemp)"
          pid=''

          cleanup() {
            rm -f "$body"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready.' >&2
            tail -n 40 "$log" >&2 || true
            exit 1
          fi

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/responses' \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "input": "Reply only with OK", "max_output_tokens": 16, "stream": False}))')")"

          echo "agentinterposer_responses_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            echo 'AgentInterposer Responses passthrough failed.' >&2
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("object") != "response" and not isinstance(data.get("output"), list):
              raise SystemExit("AgentInterposer returned an unexpected Responses schema")
          print("agentinterposer_responses_schema=ok")
          PY

      - name: Probe Codex Responses tool round trip
        if: ${{ inputs.scope == 'codex' }}
        id: codex
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if [ "$MODEL" != 'nvidia/nemotron-3-super-120b-a12b' ]; then
            echo 'Codex certification is currently defined only for nvidia/nemotron-3-super-120b-a12b.' >&2
            exit 2
          fi
          codex_root="$RUNNER_TEMP/codex-cli"
          codex_home="$RUNNER_TEMP/codex-home"
          binary="$RUNNER_TEMP/agentinterposer-codex"
          gateway_log="$RUNNER_TEMP/agentinterposer-codex.log"
          codex_jsonl="$RUNNER_TEMP/codex-events.jsonl"
          codex_stderr="$RUNNER_TEMP/codex-stderr.log"
          final_message="$RUNNER_TEMP/codex-final.txt"
          model_catalog="$RUNNER_TEMP/codex-model-catalog.json"
          pid=''

          cleanup() {
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          mkdir -p "$codex_root" "$codex_home"
          npm install --prefix "$codex_root" --no-audit --no-fund --silent '@openai/codex@0.147.0'
          codex="$codex_root/node_modules/.bin/codex"
          codex_version="$($codex --version)"
          if [ "$codex_version" != 'codex-cli 0.147.0' ]; then
            echo "Unexpected Codex version: $codex_version" >&2
            exit 1
          fi

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$gateway_log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Codex probe.' >&2
            exit 1
          fi

          python3 - "$codex_home/config.toml" "$model_catalog" "$MODEL" <<'PY'
          import json
          import sys

          config_path, catalog_path, model = sys.argv[1], sys.argv[2], sys.argv[3]
          catalog = {
              "models": [
                  {
                      "slug": model,
                      "display_name": "NVIDIA Nemotron 3 Super",
                      "description": "NVIDIA hosted tool-use model",
                      "default_reasoning_level": None,
                      "supported_reasoning_levels": [],
                      "shell_type": "shell_command",
                      "visibility": "none",
                      "minimal_client_version": [0, 147, 0],
                      "supported_in_api": True,
                      "priority": 99,
                      "upgrade": None,
                      "model_messages": {
                          "instructions_template": "You are a coding agent. Use available tools when needed and follow the user request.",
                          "instructions_variables": None,
                          "approvals": None,
                          "collaboration_modes": None,
                          "auto_review": None,
                          "permissions": None,
                      },
                      "include_skills_usage_instructions": False,
                      "include_plugin_usage_instructions": False,
                      "include_apps_usage_instructions": False,
                      "supports_reasoning_summary_parameter": False,
                      "default_reasoning_summary": "none",
                      "support_verbosity": False,
                      "default_verbosity": None,
                      "apply_patch_tool_type": None,
                      "web_search_tool_type": "text",
                      "truncation_policy": {"mode": "bytes", "limit": 10000},
                      "supports_parallel_tool_calls": False,
                      "supports_image_detail_original": False,
                      "context_window": 1000000,
                      "max_context_window": 1000000,
                      "effective_context_window_percent": 95,
                      "experimental_supported_tools": [],
                      "input_modalities": ["text"],
                      "supports_search_tool": False,
                      "use_responses_lite": False,
                  }
              ]
          }
          with open(catalog_path, "w", encoding="utf-8") as handle:
              json.dump(catalog, handle, separators=(",", ":"))

          with open(config_path, "w", encoding="utf-8") as handle:
              handle.write(f"model = {json.dumps(model)}\n")
              handle.write('model_provider = "agentinterposer"\n')
              handle.write('approval_policy = "never"\n')
              handle.write('sandbox_mode = "read-only"\n')
              handle.write('web_search = "disabled"\n')
              handle.write('model_reasoning_summary = "none"\n')
              handle.write(f"model_catalog_json = {json.dumps(catalog_path)}\n\n")
              handle.write('[agents]\n')
              handle.write('enabled = false\n\n')
              handle.write('[features]\n')
              handle.write('view_image = false\n')
              handle.write('unified_exec = false\n\n')
              handle.write('[tools.experimental_request_user_input]\n')
              handle.write('enabled = false\n\n')
              handle.write('[tools.update_plan]\n')
              handle.write('enabled = false\n\n')
              handle.write('[model_providers.agentinterposer]\n')
              handle.write('name = "AgentInterposer certification"\n')
              handle.write('base_url = "http://127.0.0.1:11435/v1"\n')
              handle.write('env_key = "AGENTINTERPOSER_CLIENT_KEY"\n')
              handle.write('wire_api = "responses"\n')
              handle.write('request_max_retries = 0\n')
              handle.write('stream_max_retries = 0\n')
          PY

          prompt='Run exactly one shell command. The executable must be cat and its only argument must be /proc/sys/kernel/random/uuid. Do not add another argument and do not run another command. Then reply with exactly the command stdout and nothing else. Do not guess or infer the value.'
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            env -u NVIDIA_API_KEY \
            CODEX_HOME="$codex_home" \
            AGENTINTERPOSER_CLIENT_KEY='local-client-placeholder' \
            "$codex" exec \
              --ephemeral \
              --sandbox read-only \
              --ignore-rules \
              --json \
              --output-last-message "$final_message" \
              "$prompt" >"$codex_jsonl" 2>"$codex_stderr"
          codex_status=$?
          set -e

          echo "codex_cli_version=$codex_version"
          echo "codex_exit=$codex_status"
          if [ "$codex_status" -ne 0 ]; then
            echo 'Codex Responses tool round trip did not complete.' >&2
          fi

          set +e
          python3 - "$codex_jsonl" "$final_message" <<'PY'
          import json
          import re
          import sys

          jsonl_path, final_path = sys.argv[1:]
          counts = {}
          item_counts = {}
          command_results = []
          successful_outputs = []
          try:
              lines = open(jsonl_path, encoding="utf-8")
          except OSError:
              lines = []
          for raw in lines:
              try:
                  event = json.loads(raw)
              except Exception:
                  continue
              event_type = str(event.get("type") or "unknown")
              counts[event_type] = counts.get(event_type, 0) + 1
              item = event.get("item")
              if not isinstance(item, dict):
                  continue
              item_type = str(item.get("type") or "unknown")
              item_counts[item_type] = item_counts.get(item_type, 0) + 1
              if event_type != "item.completed" or item_type != "command_execution":
                  continue
              status = str(item.get("status") or "unknown")
              exit_code = item.get("exit_code")
              output = item.get("aggregated_output")
              output_bytes = len(output.encode("utf-8")) if isinstance(output, str) else 0
              command_results.append((status, exit_code, output_bytes))
              if status == "completed" and exit_code == 0 and isinstance(output, str):
                  successful_outputs.append(output)

          print("codex_event_types=" + ",".join(f"{key}:{counts[key]}" for key in sorted(counts)))
          print("codex_item_types=" + ",".join(f"{key}:{item_counts[key]}" for key in sorted(item_counts)))
          for index, (status, exit_code, output_bytes) in enumerate(command_results, start=1):
              print(f"codex_command_result_{index}=status:{status},exit:{exit_code},output_bytes:{output_bytes}")
          print("codex_completed_command_count=" + str(len(command_results)))

          if len(command_results) != 1 or len(successful_outputs) != 1:
              raise SystemExit("Codex did not complete exactly one successful shell command")

          uuid_pattern = re.compile(r"\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b", re.IGNORECASE)
          match = uuid_pattern.search(successful_outputs[0])
          tool_uuid = match.group(0) if match else None
          print("codex_tool_output_uuid=" + str(tool_uuid is not None).lower())
          if tool_uuid is None:
              raise SystemExit("Successful shell command output contained no UUID proof")

          try:
              final = open(final_path, encoding="utf-8").read()
          except OSError:
              raise SystemExit("Codex produced no final response file")
          contains = tool_uuid in final
          print("codex_final_bytes=" + str(len(final.encode("utf-8"))))
          print("codex_final_contains_tool_uuid=" + str(contains).lower())
          if not contains:
              raise SystemExit("Codex final response did not contain the shell command UUID proof")
          PY
          proof_check_status=$?
          set -e

          if [ "$codex_status" -ne 0 ]; then
            exit "$codex_status"
          fi
          if [ "$proof_check_status" -ne 0 ]; then
            exit "$proof_check_status"
          fi

          echo 'codex_responses_streaming=ok'
          echo 'codex_function_call_round_trip=ok'
          echo 'codex_verified=true' >> "$GITHUB_OUTPUT"

      - name: Write compatibility summary
        if: ${{ always() }}
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          SCOPE: ${{ inputs.scope }}
          CHAT_OUTCOME: ${{ steps.chat.outcome }}
          RESPONSES_SUPPORTED: ${{ steps.responses.outputs.responses_supported }}
          MESSAGES_SUPPORTED: ${{ steps.messages.outputs.messages_supported }}
          GATEWAY_OUTCOME: ${{ steps.gateway.outcome }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          CODEX_VERIFIED: ${{ steps.codex.outputs.codex_verified }}
        run: |
          {
            echo '## NVIDIA hosted compatibility probe'
            echo
            echo "- Model: \`${MODEL}\`"
            echo "- Scope: ${SCOPE}"
            if [ "$SCOPE" = 'codex' ]; then
              echo "- Codex CLI 0.147.0 step: ${CODEX_OUTCOME:-not-run}"
              echo "- Codex Responses tool round trip: ${CODEX_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'baseline' ]; then
              echo "- Chat Completions baseline: ${CHAT_OUTCOME:-not-run}"
            else
              echo "- Chat Completions step: ${CHAT_OUTCOME:-not-run}"
              echo "- Responses API: ${RESPONSES_SUPPORTED:-unknown}"
              echo "- Anthropic Messages API: ${MESSAGES_SUPPORTED:-unknown}"
              echo "- AgentInterposer Responses passthrough step: ${GATEWAY_OUTCOME:-not-run}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
