name: Provider Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: NVIDIA hosted model ID to probe
        required: true
        default: nvidia/nemotron-3-super-120b-a12b
        type: string

permissions:
  contents: read

jobs:
  nvidia-hosted:
    name: nvidia-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate Doppler bootstrap token
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "DOPPLER_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@12f29f902bf9279a3888501b9d27ba9f968a07c2 # v4.0.1

      - name: Fetch NVIDIA credential from Doppler
        id: doppler
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          value="$(doppler secrets get NVIDIA_API_KEY --plain --project oaslananka-ops --config runtime)"
          if [ -z "$value" ]; then
            echo "NVIDIA_API_KEY was not returned by Doppler." >&2
            exit 1
          fi
          echo "::add-mask::$value"
          printf 'NVIDIA_API_KEY=%s\n' "$value" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Probe Chat Completions
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/chat/completions' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 16, "stream": False}))')")"

          echo "chat_completions_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("chat_completions_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("chat_completions_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("chat_completions_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(data.get("choices"), list):
              raise SystemExit("Chat Completions response is missing choices[]")
          print("chat_completions_schema=ok")
          PY

      - name: Probe Responses API
        id: responses
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/responses' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "input": "Reply only with OK", "max_output_tokens": 16, "stream": False}))')")"

          echo "responses_http=${status}"
          if [[ "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("object") != "response" and not isinstance(data.get("output"), list):
              raise SystemExit("Responses API returned an unexpected schema")
          print("responses_schema=ok")
          PY
            echo "responses_supported=true" >> "$GITHUB_OUTPUT"
          else
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("responses_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("responses_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("responses_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            echo "responses_supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Anthropic Messages API
        id: messages
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/messages' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 16, "stream": False}))')")"

          echo "messages_http=${status}"
          if [[ "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("type") != "message" and not isinstance(data.get("content"), list):
              raise SystemExit("Messages API returned an unexpected schema")
          print("messages_schema=ok")
          PY
            echo "messages_supported=true" >> "$GITHUB_OUTPUT"
          else
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("messages_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("messages_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("messages_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            echo "messages_supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Responses function call
        id: responses_tool
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          set +e
          status="$(curl --silent --show-error \
            --max-time 90 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/responses' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "input": "Call proof_reader with value ping. Do not answer directly.", "tools": [{"type": "function", "name": "proof_reader", "description": "Return a proof value", "parameters": {"type": "object", "properties": {"value": {"type": "string"}}, "required": ["value"], "additionalProperties": False}}], "tool_choice": "required", "parallel_tool_calls": False, "max_output_tokens": 256, "stream": False}))')")"
          curl_status=$?
          set -e

          echo "responses_tool_curl_exit=${curl_status}"
          echo "responses_tool_http=${status}"
          if [ "$curl_status" -ne 0 ]; then
            echo 'Responses function-call probe timed out or failed at the transport layer.' >&2
            exit "$curl_status"
          fi
          if [[ ! "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("responses_tool_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("responses_tool_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("responses_tool_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          output = data.get("output") or []
          calls = [item for item in output if isinstance(item, dict) and item.get("type") == "function_call"]
          if not calls:
              raise SystemExit("Responses function-call probe returned no function_call output item")
          if calls[0].get("name") != "proof_reader":
              raise SystemExit("Responses function-call probe called an unexpected function")
          if not calls[0].get("call_id"):
              raise SystemExit("Responses function-call probe returned no call_id")
          print("responses_function_call=ok")
          PY
          echo 'responses_tool_verified=true' >> "$GITHUB_OUTPUT"

      - name: Probe Responses function call stream
        id: responses_tool_stream
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          set +e
          status="$(curl --silent --show-error --no-buffer \
            --max-time 90 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/responses' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "input": "Call proof_reader with value ping. Do not answer directly.", "tools": [{"type": "function", "name": "proof_reader", "description": "Return a proof value", "parameters": {"type": "object", "properties": {"value": {"type": "string"}}, "required": ["value"], "additionalProperties": False}}], "tool_choice": "required", "parallel_tool_calls": False, "max_output_tokens": 256, "stream": True}))')")"
          curl_status=$?
          set -e

          echo "responses_tool_stream_curl_exit=${curl_status}"
          echo "responses_tool_stream_http=${status}"
          if [ "$curl_status" -ne 0 ]; then
            echo 'Streaming Responses function-call probe timed out or failed at the transport layer.' >&2
            exit "$curl_status"
          fi
          if [[ ! "$status" =~ ^2 ]]; then
            echo 'Streaming Responses function-call probe returned a non-2xx status.' >&2
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json
          import sys

          event_types = []
          function_call_seen = False
          completed_seen = False
          for raw in open(sys.argv[1], encoding="utf-8"):
              line = raw.strip()
              if line.startswith("event:"):
                  event_types.append(line.split(":", 1)[1].strip())
                  continue
              if not line.startswith("data:"):
                  continue
              payload = line.split(":", 1)[1].strip()
              if payload == "[DONE]":
                  continue
              try:
                  data = json.loads(payload)
              except Exception:
                  continue
              event_type = data.get("type")
              if event_type and event_type not in event_types:
                  event_types.append(str(event_type))
              item = data.get("item")
              if event_type == "response.output_item.added":
                  output_item_added_shape = item_shape(item)
              if event_type == "response.output_item.done":
                  output_item_done_shape = item_shape(item)
              if isinstance(item, dict) and item.get("type") == "function_call":
                  function_call_seen = True
              if event_type == "response.completed":
                  completed_seen = True
          print("responses_tool_stream_events=" + ",".join(dict.fromkeys(event_types)))
          if not function_call_seen:
              raise SystemExit("Streaming Responses probe emitted no function_call item")
          if not completed_seen:
              raise SystemExit("Streaming Responses probe emitted no response.completed event")
          print("responses_function_call_stream=ok")
          PY
          echo 'responses_tool_stream_verified=true' >> "$GITHUB_OUTPUT"

      - name: Probe AgentInterposer Responses passthrough
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer"
          log="$RUNNER_TEMP/agentinterposer.log"
          body="$(mktemp)"
          pid=''

          cleanup() {
            rm -f "$body"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready.' >&2
            tail -n 40 "$log" >&2 || true
            exit 1
          fi

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/responses' \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "input": "Reply only with OK", "max_output_tokens": 16, "stream": False}))')")"

          echo "agentinterposer_responses_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            echo 'AgentInterposer Responses passthrough failed.' >&2
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("object") != "response" and not isinstance(data.get("output"), list):
              raise SystemExit("AgentInterposer returned an unexpected Responses schema")
          print("agentinterposer_responses_schema=ok")
          PY

      - name: Probe Codex Responses tool round trip
        id: codex
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-cli"
          codex_home="$RUNNER_TEMP/codex-home"
          binary="$RUNNER_TEMP/agentinterposer-codex"
          gateway_log="$RUNNER_TEMP/agentinterposer-codex.log"
          codex_jsonl="$RUNNER_TEMP/codex-events.jsonl"
          codex_stderr="$RUNNER_TEMP/codex-stderr.log"
          final_message="$RUNNER_TEMP/codex-final.txt"
          model_catalog="$RUNNER_TEMP/codex-model-catalog.json"
          proof_file="$GITHUB_WORKSPACE/.agentinterposer-codex-proof"
          capture_request="$RUNNER_TEMP/codex-captured-request.json"
          capture_home="$RUNNER_TEMP/codex-capture-home"
          exact_response="$RUNNER_TEMP/codex-exact-response.sse"
          gateway_exact_response="$RUNNER_TEMP/codex-gateway-exact-response.sse"
          direct_headers="$RUNNER_TEMP/codex-direct-response.headers"
          gateway_headers="$RUNNER_TEMP/codex-gateway-response.headers"
          pid=''
          capture_pid=''
          capture_gateway_pid=''

          cleanup() {
            rm -f "$proof_file"
            for child in "$capture_gateway_pid" "$capture_pid" "$pid"; do
              if [ -n "$child" ]; then
                kill "$child" 2>/dev/null || true
                wait "$child" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT

          mkdir -p "$codex_root" "$codex_home"
          npm install --prefix "$codex_root" --no-audit --no-fund --silent '@openai/codex@0.147.0'
          codex="$codex_root/node_modules/.bin/codex"
          codex_version="$($codex --version)"
          if [ "$codex_version" != 'codex-cli 0.147.0' ]; then
            echo "Unexpected Codex version: $codex_version" >&2
            exit 1
          fi

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$gateway_log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Codex probe.' >&2
            exit 1
          fi

          proof="AGENTINTERPOSER_CODEX_TOOL_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          printf '%s\n' "$proof" > "$proof_file"

          python3 - "$codex_home/config.toml" "$model_catalog" "$MODEL" <<'PY'
          import json
          import sys

          config_path, catalog_path, model = sys.argv[1], sys.argv[2], sys.argv[3]
          catalog = {
              "models": [
                  {
                      "slug": model,
                      "display_name": "NVIDIA Nemotron 3 Super",
                      "description": "NVIDIA hosted tool-use model",
                      "default_reasoning_level": None,
                      "supported_reasoning_levels": [],
                      "shell_type": "default",
                      "visibility": "none",
                      "minimal_client_version": [0, 147, 0],
                      "supported_in_api": True,
                      "priority": 99,
                      "upgrade": None,
                      "model_messages": {
                          "instructions_template": "You are a coding agent. Use available tools when needed and follow the user request.",
                          "instructions_variables": None,
                          "approvals": None,
                          "collaboration_modes": None,
                          "auto_review": None,
                          "permissions": None,
                      },
                      "include_skills_usage_instructions": False,
                      "include_plugin_usage_instructions": False,
                      "include_apps_usage_instructions": False,
                      "supports_reasoning_summary_parameter": False,
                      "default_reasoning_summary": "none",
                      "support_verbosity": False,
                      "default_verbosity": None,
                      "apply_patch_tool_type": None,
                      "web_search_tool_type": "text",
                      "truncation_policy": {"mode": "bytes", "limit": 10000},
                      "supports_parallel_tool_calls": False,
                      "supports_image_detail_original": False,
                      "context_window": 1000000,
                      "max_context_window": 1000000,
                      "effective_context_window_percent": 95,
                      "experimental_supported_tools": [],
                      "input_modalities": ["text"],
                      "supports_search_tool": False,
                      "use_responses_lite": False,
                  }
              ]
          }
          with open(catalog_path, "w", encoding="utf-8") as handle:
              json.dump(catalog, handle, separators=(",", ":"))

          with open(config_path, "w", encoding="utf-8") as handle:
              handle.write(f"model = {json.dumps(model)}\n")
              handle.write('model_provider = "agentinterposer"\n')
              handle.write('approval_policy = "never"\n')
              handle.write('sandbox_mode = "read-only"\n')
              handle.write('web_search = "disabled"\n')
              handle.write('model_reasoning_summary = "none"\n')
              handle.write(f"model_catalog_json = {json.dumps(catalog_path)}\n\n")
              handle.write('[agents]\n')
              handle.write('enabled = false\n\n')
              handle.write('[model_providers.agentinterposer]\n')
              handle.write('name = "AgentInterposer certification"\n')
              handle.write('base_url = "http://127.0.0.1:11435/v1"\n')
              handle.write('env_key = "AGENTINTERPOSER_CLIENT_KEY"\n')
              handle.write('wire_api = "responses"\n')
              handle.write('request_max_retries = 0\n')
              handle.write('stream_max_retries = 0\n')
          PY

          prompt="Use the shell tool to read the exact contents of $proof_file. Then reply with exactly the file contents and nothing else. Do not guess or infer the contents."

          mkdir -p "$capture_home"
          python3 - "$codex_home/config.toml" "$capture_home/config.toml" <<'PY'
          import sys

          source, target = sys.argv[1], sys.argv[2]
          text = open(source, encoding="utf-8").read()
          text = text.replace("http://127.0.0.1:11435/v1", "http://127.0.0.1:11436/v1")
          with open(target, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY

          capture_server="$RUNNER_TEMP/codex-capture-server.py"
          cat > "$capture_server" <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import os

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *_args):
                  return

              def do_POST(self):
                  length = int(self.headers.get("content-length", "0"))
                  with open(os.environ["CAPTURE_REQUEST"], "wb") as handle:
                      handle.write(self.rfile.read(length))
                  self.send_response(500)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'{"error":{"message":"capture-stop"}}')

          ThreadingHTTPServer(("127.0.0.1", 18113), Handler).serve_forever()
          PY

          CAPTURE_REQUEST="$capture_request" python3 "$capture_server" >"$RUNNER_TEMP/codex-capture-server.log" 2>&1 &
          capture_pid=$!
          AGENTINTERPOSER_ADDR='127.0.0.1:11436' \
            AGENTINTERPOSER_UPSTREAM_URL='http://127.0.0.1:18113' \
            AGENTINTERPOSER_UPSTREAM_BEARER_TOKEN='capture-only' \
            AGENTINTERPOSER_MAX_RETRIES=0 \
            "$binary" >"$RUNNER_TEMP/agentinterposer-capture.log" 2>&1 &
          capture_gateway_pid=$!

          capture_ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11436/healthz' >/dev/null; then
              capture_ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$capture_ready" != true ]; then
            echo 'Capture-only AgentInterposer did not become ready.' >&2
            exit 1
          fi

          set +e
          CODEX_HOME="$capture_home" \
            AGENTINTERPOSER_CLIENT_KEY='capture-client-placeholder' \
            "$codex" exec \
              --ephemeral \
              --sandbox read-only \
              --ignore-rules \
              --json \
              "$prompt" >"$RUNNER_TEMP/codex-capture-events.jsonl" 2>"$RUNNER_TEMP/codex-capture-stderr.log"
          capture_status=$?
          set -e
          echo "codex_capture_exit=${capture_status}"

          for _ in {1..30}; do
            if [ -s "$capture_request" ]; then
              break
            fi
            sleep 0.1
          done
          if [ ! -s "$capture_request" ]; then
            echo 'Codex capture produced no Responses request.' >&2
            exit 1
          fi

          kill "$capture_gateway_pid" "$capture_pid" 2>/dev/null || true
          wait "$capture_gateway_pid" 2>/dev/null || true
          wait "$capture_pid" 2>/dev/null || true
          capture_gateway_pid=''
          capture_pid=''

          python3 - "$capture_request" <<'PY'
          import json
          import sys

          raw = open(sys.argv[1], "rb").read()
          data = json.loads(raw)
          tools = data.get("tools") or []
          if data.get("stream") is not True:
              raise SystemExit("Captured Codex request did not enable Responses streaming")
          if not tools or not all(isinstance(tool, dict) and tool.get("type") == "function" for tool in tools):
              raise SystemExit("Captured Codex request did not contain only function tools")
          print("codex_capture_bytes=" + str(len(raw)))
          print("codex_capture_tool_count=" + str(len(tools)))
          print("codex_capture_reasoning=" + json.dumps(data.get("reasoning"), sort_keys=True, separators=(",", ":")))
          PY

          set +e
          exact_http="$(curl --silent --show-error --no-buffer \
            --max-time 90 \
            --dump-header "$direct_headers" \
            --output "$exact_response" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/responses' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary "@$capture_request")"
          exact_curl_status=$?
          set -e
          echo "codex_exact_raw_curl_exit=${exact_curl_status}"
          echo "codex_exact_raw_http=${exact_http}"
          if [ "$exact_curl_status" -ne 0 ]; then
            echo 'Exact captured Codex request timed out at NVIDIA Responses.' >&2
            exit "$exact_curl_status"
          fi
          if [[ ! "$exact_http" =~ ^2 ]]; then
            echo 'Exact captured Codex request returned a non-2xx status.' >&2
            exit 1
          fi

          python3 - "$exact_response" <<'PY'
          import json
          import sys

          events = []
          function_name = None
          call_id_present = False
          argument_keys = []
          output_item_added_shape = None
          output_item_done_shape = None
          completed_response_shape = None
          completed_seen = False

          def value_type(value):
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "bool"
              if isinstance(value, str):
                  return "string"
              if isinstance(value, (int, float)):
                  return "number"
              if isinstance(value, list):
                  return "array"
              if isinstance(value, dict):
                  return "object"
              return type(value).__name__

          def item_shape(item):
              if not isinstance(item, dict):
                  return {"value_type": value_type(item)}
              selected = {key: value_type(item.get(key)) for key in ("type", "id", "name", "arguments", "call_id", "status") if key in item}
              return {"keys": sorted(item.keys()), "types": selected}
          for raw in open(sys.argv[1], encoding="utf-8"):
              line = raw.strip()
              if line.startswith("event:"):
                  events.append(line.split(":", 1)[1].strip())
                  continue
              if not line.startswith("data:"):
                  continue
              payload = line.split(":", 1)[1].strip()
              if payload == "[DONE]":
                  continue
              try:
                  data = json.loads(payload)
              except Exception:
                  continue
              event_type = data.get("type")
              if event_type:
                  events.append(str(event_type))
              item = data.get("item")
              if event_type == "response.output_item.added":
                  output_item_added_shape = item_shape(item)
              if event_type == "response.output_item.done":
                  output_item_done_shape = item_shape(item)
              if isinstance(item, dict) and item.get("type") == "function_call":
                  function_name = item.get("name") or function_name
                  call_id_present = bool(item.get("call_id")) or call_id_present
                  arguments = item.get("arguments")
                  if isinstance(arguments, str) and arguments:
                      try:
                          parsed = json.loads(arguments)
                      except Exception:
                          parsed = None
                      if isinstance(parsed, dict):
                          argument_keys = sorted(parsed.keys())
              if event_type == "response.function_call_arguments.done":
                  arguments = data.get("arguments")
                  if isinstance(arguments, str):
                      try:
                          parsed = json.loads(arguments)
                      except Exception:
                          parsed = None
                      if isinstance(parsed, dict):
                          argument_keys = sorted(parsed.keys())
              if event_type == "response.completed":
                  completed_seen = True
                  completed_response_shape = item_shape(data.get("response"))
          print("codex_exact_raw_events=" + ",".join(dict.fromkeys(events)))
          print("codex_exact_raw_output_item_added_shape=" + json.dumps(output_item_added_shape, sort_keys=True, separators=(",", ":")))
          print("codex_exact_raw_output_item_done_shape=" + json.dumps(output_item_done_shape, sort_keys=True, separators=(",", ":")))
          print("codex_exact_raw_completed_response_shape=" + json.dumps(completed_response_shape, sort_keys=True, separators=(",", ":")))
          print("codex_exact_raw_function_name=" + str(function_name or "missing"))
          print("codex_exact_raw_call_id_present=" + str(call_id_present).lower())
          print("codex_exact_raw_argument_keys=" + ",".join(argument_keys))
          if not completed_seen:
              raise SystemExit("Exact Codex request emitted no response.completed event")
          if not function_name:
              raise SystemExit("Exact Codex request emitted no function_call item")
          print("codex_exact_raw_function_call=ok")
          PY

          set +e
          gateway_exact_http="$(curl --silent --show-error --no-buffer \
            --max-time 90 \
            --dump-header "$gateway_headers" \
            --output "$gateway_exact_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/responses' \
            --header 'Content-Type: application/json' \
            --data-binary "@$capture_request")"
          gateway_exact_curl_status=$?
          set -e
          echo "codex_gateway_exact_curl_exit=${gateway_exact_curl_status}"
          echo "codex_gateway_exact_http=${gateway_exact_http}"
          if [ "$gateway_exact_curl_status" -ne 0 ]; then
            echo 'Exact Codex request timed out through AgentInterposer.' >&2
            exit "$gateway_exact_curl_status"
          fi
          if [[ ! "$gateway_exact_http" =~ ^2 ]]; then
            echo 'Exact Codex request through AgentInterposer returned a non-2xx status.' >&2
            exit 1
          fi

          python3 - "$gateway_exact_response" "$direct_headers" "$gateway_headers" <<'PY'
          import json
          import sys

          response_path, direct_header_path, gateway_header_path = sys.argv[1:]
          events = []
          function_name = None
          call_id_present = False
          argument_keys = []
          output_item_added_shape = None
          output_item_done_shape = None
          completed_response_shape = None
          completed_seen = False

          def value_type(value):
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "bool"
              if isinstance(value, str):
                  return "string"
              if isinstance(value, (int, float)):
                  return "number"
              if isinstance(value, list):
                  return "array"
              if isinstance(value, dict):
                  return "object"
              return type(value).__name__

          def item_shape(item):
              if not isinstance(item, dict):
                  return {"value_type": value_type(item)}
              selected = {key: value_type(item.get(key)) for key in ("type", "id", "name", "arguments", "call_id", "status") if key in item}
              return {"keys": sorted(item.keys()), "types": selected}
          for raw in open(response_path, encoding="utf-8"):
              line = raw.strip()
              if line.startswith("event:"):
                  events.append(line.split(":", 1)[1].strip())
                  continue
              if not line.startswith("data:"):
                  continue
              payload = line.split(":", 1)[1].strip()
              if payload == "[DONE]":
                  continue
              try:
                  data = json.loads(payload)
              except Exception:
                  continue
              event_type = data.get("type")
              if event_type:
                  events.append(str(event_type))
              item = data.get("item")
              if isinstance(item, dict) and item.get("type") == "function_call":
                  function_name = item.get("name") or function_name
                  call_id_present = bool(item.get("call_id")) or call_id_present
              if event_type == "response.function_call_arguments.done":
                  arguments = data.get("arguments")
                  if isinstance(arguments, str):
                      try:
                          parsed = json.loads(arguments)
                      except Exception:
                          parsed = None
                      if isinstance(parsed, dict):
                          argument_keys = sorted(parsed.keys())
              if event_type == "response.completed":
                  completed_seen = True
                  completed_response_shape = item_shape(data.get("response"))

          def selected_headers(path):
              selected = {}
              for raw in open(path, encoding="utf-8", errors="replace"):
                  if ":" not in raw:
                      continue
                  key, value = raw.split(":", 1)
                  key = key.strip().lower()
                  if key in {"content-type", "cache-control", "content-encoding", "transfer-encoding", "connection", "x-accel-buffering"}:
                      selected[key] = value.strip()
              return selected

          print("codex_gateway_exact_events=" + ",".join(dict.fromkeys(events)))
          print("codex_gateway_exact_output_item_added_shape=" + json.dumps(output_item_added_shape, sort_keys=True, separators=(",", ":")))
          print("codex_gateway_exact_output_item_done_shape=" + json.dumps(output_item_done_shape, sort_keys=True, separators=(",", ":")))
          print("codex_gateway_exact_completed_response_shape=" + json.dumps(completed_response_shape, sort_keys=True, separators=(",", ":")))
          print("codex_gateway_exact_function_name=" + str(function_name or "missing"))
          print("codex_gateway_exact_call_id_present=" + str(call_id_present).lower())
          print("codex_gateway_exact_argument_keys=" + ",".join(argument_keys))
          print("codex_direct_selected_headers=" + json.dumps(selected_headers(direct_header_path), sort_keys=True, separators=(",", ":")))
          print("codex_gateway_selected_headers=" + json.dumps(selected_headers(gateway_header_path), sort_keys=True, separators=(",", ":")))
          if not completed_seen:
              raise SystemExit("Gateway exact Codex request emitted no response.completed event")
          if not function_name:
              raise SystemExit("Gateway exact Codex request emitted no function_call item")
          print("codex_gateway_exact_function_call=ok")
          PY

          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            env CODEX_HOME="$codex_home" \
            AGENTINTERPOSER_CLIENT_KEY='local-client-placeholder' \
            "$codex" exec \
              --ephemeral \
              --sandbox read-only \
              --ignore-rules \
              --json \
              --output-last-message "$final_message" \
              "$prompt" >"$codex_jsonl" 2>"$codex_stderr"
          codex_status=$?
          set -e

          echo "codex_cli_version=$codex_version"
          echo "codex_exit=$codex_status"
          if [ "$codex_status" -ne 0 ]; then
            echo 'Codex Responses compatibility probe failed.' >&2
            echo "codex_failure_status=$codex_status" >&2
            python3 - "$codex_jsonl" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          counts = {}
          item_counts = {}
          errors = []
          try:
              lines = open(path, encoding="utf-8")
          except OSError:
              lines = []
          for raw in lines:
              try:
                  event = json.loads(raw)
              except Exception:
                  continue
              event_type = str(event.get("type") or "unknown")
              counts[event_type] = counts.get(event_type, 0) + 1
              item = event.get("item")
              if isinstance(item, dict):
                  item_type = str(item.get("type") or "unknown")
                  item_counts[item_type] = item_counts.get(item_type, 0) + 1
                  if item_type == "error":
                      item_message = item.get("message") or item.get("error")
                      if item_message:
                          errors.append(str(item_message)[:240])
              error = event.get("error")
              if isinstance(error, dict):
                  message = error.get("message") or error.get("type")
                  if message:
                      errors.append(str(message)[:240])
              elif error:
                  errors.append(str(error)[:240])
          print("codex_event_types=" + ",".join(f"{key}:{counts[key]}" for key in sorted(counts)), file=sys.stderr)
          print("codex_item_types=" + ",".join(f"{key}:{item_counts[key]}" for key in sorted(item_counts)), file=sys.stderr)
          for message in errors[-3:]:
              print("codex_event_error=" + message, file=sys.stderr)
          PY
            tail -n 20 "$codex_stderr" >&2 || true
            exit "$codex_status"
          fi

          actual="$(tr -d '\r\n' < "$final_message")"
          if [ "$actual" != "$proof" ]; then
            echo 'Codex final response did not match the shell-only proof value.' >&2
            exit 1
          fi

          echo 'codex_responses_streaming=ok'
          echo 'codex_function_call_round_trip=ok'
          echo 'codex_model_metadata=ok'
          echo 'codex_reasoning_request=neutral'
          echo 'codex_verified=true' >> "$GITHUB_OUTPUT"

      - name: Write compatibility summary
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          RESPONSES_SUPPORTED: ${{ steps.responses.outputs.responses_supported }}
          MESSAGES_SUPPORTED: ${{ steps.messages.outputs.messages_supported }}
          CODEX_VERIFIED: ${{ steps.codex.outputs.codex_verified }}
          RESPONSES_TOOL_VERIFIED: ${{ steps.responses_tool.outputs.responses_tool_verified }}
          RESPONSES_TOOL_STREAM_VERIFIED: ${{ steps.responses_tool_stream.outputs.responses_tool_stream_verified }}
        run: |
          {
            echo '## NVIDIA hosted compatibility probe'
            echo
            echo "- Model: \`${MODEL}\`"
            echo '- Chat Completions: supported (required for this workflow to pass)'
            echo "- Responses API: ${RESPONSES_SUPPORTED:-unknown}"
            echo "- Anthropic Messages API: ${MESSAGES_SUPPORTED:-unknown}"
            echo '- AgentInterposer Responses passthrough: verified'
            echo "- Responses function call: ${RESPONSES_TOOL_VERIFIED:-unknown}"
            echo "- Responses streaming function call: ${RESPONSES_TOOL_STREAM_VERIFIED:-unknown}"
            echo "- Codex CLI 0.147.0 Responses tool round trip: ${CODEX_VERIFIED:-unknown}"
            echo '- Codex NVIDIA profile: web search disabled; multi-agent namespace disabled'
          } >> "$GITHUB_STEP_SUMMARY"
