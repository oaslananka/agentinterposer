name: Provider Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: NVIDIA hosted model ID to probe
        required: true
        default: nvidia/nemotron-3-super-120b-a12b
        type: string
      fallback_model:
        description: Optional same-upstream fallback model for routing probes
        required: false
        default: ""
        type: string
      scope:
        description: Smoke scope
        required: true
        default: full
        type: choice
        options:
          - baseline
          - full
          - models
          - responses-fallback
          - responses-structured-fallback
          - messages
          - messages-vision
          - messages-vision-fallback
          - chat-vision-fallback
          - messages-stream
          - claude-code
          - claude-code-error
          - claude-code-loop
          - codex
          - codex-loop
          - codex-long-loop

permissions:
  contents: read

jobs:
  nvidia-hosted:
    name: nvidia-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate Doppler bootstrap token
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "DOPPLER_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Fetch NVIDIA credential from Doppler
        id: doppler
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          value="$(doppler secrets get NVIDIA_API_KEY --plain --project oaslananka-ops --config runtime)"
          if [ -z "$value" ]; then
            echo "NVIDIA_API_KEY was not returned by Doppler." >&2
            exit 1
          fi
          echo "::add-mask::$value"
          printf 'NVIDIA_API_KEY=%s\n' "$value" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Probe Models discovery
        if: ${{ inputs.scope == 'models' }}
        id: models
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          direct_body="$RUNNER_TEMP/nvidia-models-direct.json"
          gateway_body="$RUNNER_TEMP/nvidia-models-gateway.json"
          binary="$RUNNER_TEMP/agentinterposer-models"
          gateway_log="$RUNNER_TEMP/agentinterposer-models.log"
          pid=''
          cleanup() {
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f "$direct_body" "$gateway_body" "$binary" "$gateway_log"
          }
          trap cleanup EXIT

          direct_status="$(curl --silent --show-error \
            --max-time 60 \
            --output "$direct_body" \
            --write-out '%{http_code}' \
            'https://integrate.api.nvidia.com/v1/models' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}")"
          echo "models_direct_http=${direct_status}"
          if [[ ! "$direct_status" =~ ^2 ]]; then
            echo 'Hosted models discovery did not return a 2xx response.' >&2
            exit 1
          fi
          python3 - "$direct_body" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          models = data.get("data")
          if data.get("object") != "list" or not isinstance(models, list):
              raise SystemExit("Hosted models discovery returned an unexpected schema")
          if not models:
              raise SystemExit("Hosted models discovery returned an empty model list")
          if not all(isinstance(item, dict) and isinstance(item.get("id"), str) and item.get("id") for item in models):
              raise SystemExit("Hosted models discovery returned an invalid model entry")
          print("models_direct_schema=ok")
          print("models_direct_count=" + str(len(models)))
          PY

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$gateway_log" 2>&1 &
          pid=$!
          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for models discovery.' >&2
            exit 1
          fi

          gateway_status="$(curl --silent --show-error \
            --max-time 60 \
            --output "$gateway_body" \
            --write-out '%{http_code}' \
            'http://127.0.0.1:11435/v1/models' \
            --header 'Authorization: Bearer client-placeholder')"
          echo "agentinterposer_models_http=${gateway_status}"
          if [[ ! "$gateway_status" =~ ^2 ]]; then
            echo 'AgentInterposer models discovery did not return a 2xx response.' >&2
            exit 1
          fi
          python3 - "$gateway_body" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          models = data.get("data")
          if data.get("object") != "list" or not isinstance(models, list):
              raise SystemExit("AgentInterposer models discovery returned an unexpected schema")
          if not models:
              raise SystemExit("AgentInterposer models discovery returned an empty model list")
          if not all(isinstance(item, dict) and isinstance(item.get("id"), str) and item.get("id") for item in models):
              raise SystemExit("AgentInterposer models discovery returned an invalid model entry")
          print("agentinterposer_models_schema=ok")
          print("agentinterposer_models_count=" + str(len(models)))
          PY
          echo 'models_verified=true' >> "$GITHUB_OUTPUT"

      - name: Probe Chat Completions
        if: ${{ inputs.scope == 'full' || inputs.scope == 'baseline' }}
        id: chat
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/chat/completions' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 16, "stream": False}))')")"

          echo "chat_completions_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("chat_completions_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("chat_completions_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("chat_completions_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(data.get("choices"), list):
              raise SystemExit("Chat Completions response is missing choices[]")
          print("chat_completions_schema=ok")
          PY

      - name: Probe Responses API
        if: ${{ inputs.scope == 'full' }}
        id: responses
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/responses' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "input": "Reply only with OK", "max_output_tokens": 16, "stream": False}))')")"

          echo "responses_http=${status}"
          if [[ "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("object") != "response" and not isinstance(data.get("output"), list):
              raise SystemExit("Responses API returned an unexpected schema")
          print("responses_schema=ok")
          PY
            echo "responses_supported=true" >> "$GITHUB_OUTPUT"
          else
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("responses_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("responses_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("responses_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            echo "responses_supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Anthropic Messages API
        if: ${{ inputs.scope == 'full' }}
        id: messages
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/messages' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 16, "stream": False}))')")"

          echo "messages_http=${status}"
          if [[ "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("type") != "message" and not isinstance(data.get("content"), list):
              raise SystemExit("Messages API returned an unexpected schema")
          print("messages_schema=ok")
          PY
            echo "messages_supported=true" >> "$GITHUB_OUTPUT"
          else
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("messages_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("messages_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("messages_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            echo "messages_supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe AgentInterposer Responses passthrough
        if: ${{ inputs.scope == 'full' || inputs.scope == 'responses-fallback' || inputs.scope == 'responses-structured-fallback' }}
        id: gateway
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
          FALLBACK_MODEL: ${{ inputs.fallback_model }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer"
          log="$RUNNER_TEMP/agentinterposer.log"
          body="$(mktemp)"
          pid=''

          cleanup() {
            rm -f "$body"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          fallback_models=''
          if [ "$SCOPE" = 'responses-fallback' ] || [ "$SCOPE" = 'responses-structured-fallback' ]; then
            if [ -z "$FALLBACK_MODEL" ]; then
              echo "$SCOPE requires fallback_model." >&2
              exit 2
            fi
            fallback_models="$FALLBACK_MODEL"
          fi

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            AGENTINTERPOSER_FALLBACK_MODELS="$fallback_models" \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready.' >&2
            tail -n 40 "$log" >&2 || true
            exit 1
          fi

          request_json="$(python3 - <<'PY'
          import json
          import os

          payload = {
              "model": os.environ["MODEL"],
              "input": "Reply only with OK",
              "max_output_tokens": 16,
              "stream": False,
          }
          if os.environ["SCOPE"] == "responses-structured-fallback":
              payload["input"] = [
                  {
                      "role": "user",
                      "content": [
                          {"type": "input_text", "text": "Reply only with OK"},
                      ],
                  },
              ]
          print(json.dumps(payload, separators=(",", ":")))
          PY
          )"

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/responses' \
            --header 'Content-Type: application/json' \
            --data "$request_json")"

          echo "agentinterposer_responses_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            echo 'AgentInterposer Responses passthrough failed.' >&2
            exit 1
          fi

          python3 - "$body" "$SCOPE" "$MODEL" "$FALLBACK_MODEL" <<'PY'
          import json, sys
          body_path, scope, model, fallback_model = sys.argv[1:]
          data = json.load(open(body_path, encoding="utf-8"))
          if data.get("object") != "response" and not isinstance(data.get("output"), list):
              raise SystemExit("AgentInterposer returned an unexpected Responses schema")
          if scope in {"responses-fallback", "responses-structured-fallback"}:
              if data.get("model") != fallback_model:
                  raise SystemExit("Responses fallback did not report the configured routed model")
              print("agentinterposer_responses_fallback_model=ok")
          print("agentinterposer_responses_schema=ok")
          PY
          if [ "$SCOPE" = 'responses-fallback' ] || [ "$SCOPE" = 'responses-structured-fallback' ]; then
            echo 'responses_fallback_verified=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Probe AgentInterposer Messages adapter
        if: ${{ inputs.scope == 'messages' }}
        id: messages_gateway
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer-messages"
          log="$RUNNER_TEMP/agentinterposer-messages.log"
          text_request="$(mktemp)"
          text_response="$(mktemp)"
          tool_request="$(mktemp)"
          tool_response="$(mktemp)"
          followup_request="$(mktemp)"
          followup_response="$(mktemp)"
          pid=''

          cleanup() {
            rm -f "$text_request" "$text_response" "$tool_request" "$tool_response" "$followup_request" "$followup_response"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Messages probe.' >&2
            exit 1
          fi

          python3 - "$MODEL" "$text_request" "$tool_request" <<'PY'
          import json
          import sys

          model, text_path, tool_path = sys.argv[1:]
          with open(text_path, "w", encoding="utf-8") as handle:
              json.dump({
                  "model": model,
                  "max_tokens": 32,
                  "temperature": 1.0,
                  "top_p": 0.95,
                  "messages": [{"role": "user", "content": "Reply briefly with OK."}],
              }, handle)

          tool = {
              "name": "get_probe_value",
              "description": "Return a deterministic probe value supplied by the client.",
              "input_schema": {"type": "object", "properties": {}, "additionalProperties": False},
          }
          with open(tool_path, "w", encoding="utf-8") as handle:
              json.dump({
                  "model": model,
                  "max_tokens": 128,
                  "temperature": 1.0,
                  "top_p": 0.95,
                  "tools": [tool],
                  "tool_choice": {"type": "tool", "name": "get_probe_value", "disable_parallel_tool_use": True},
                  "messages": [{"role": "user", "content": "Call get_probe_value exactly once."}],
              }, handle)
          PY

          text_status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$text_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$text_request")"
          echo "agentinterposer_messages_text_http=${text_status}"
          if [[ ! "$text_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages text probe failed.' >&2
            exit 1
          fi
          python3 - "$text_response" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("type") != "message" or data.get("role") != "assistant":
              raise SystemExit("Messages text response has an unexpected envelope")
          content = data.get("content")
          if not isinstance(content, list) or not any(isinstance(block, dict) and block.get("type") == "text" for block in content):
              raise SystemExit("Messages text response contains no text block")
          if data.get("stop_reason") not in {"end_turn", "max_tokens"}:
              raise SystemExit("Messages text response has an unexpected stop_reason")
          print("agentinterposer_messages_text_schema=ok")
          PY

          tool_status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$tool_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$tool_request")"
          echo "agentinterposer_messages_tool_http=${tool_status}"
          if [[ ! "$tool_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages tool-use probe failed.' >&2
            exit 1
          fi

          python3 - "$MODEL" "$tool_response" "$followup_request" <<'PY'
          import json
          import sys

          model, response_path, followup_path = sys.argv[1:]
          data = json.load(open(response_path, encoding="utf-8"))
          if data.get("stop_reason") != "tool_use":
              raise SystemExit("Messages tool response did not stop for tool_use")
          content = data.get("content")
          if not isinstance(content, list):
              raise SystemExit("Messages tool response content is not a list")
          tool_use = next((block for block in content if isinstance(block, dict) and block.get("type") == "tool_use" and block.get("name") == "get_probe_value"), None)
          if not tool_use or not isinstance(tool_use.get("id"), str) or not tool_use["id"] or not isinstance(tool_use.get("input"), dict):
              raise SystemExit("Messages tool response has an invalid tool_use block")
          tool = {
              "name": "get_probe_value",
              "description": "Return a deterministic probe value supplied by the client.",
              "input_schema": {"type": "object", "properties": {}, "additionalProperties": False},
          }
          followup = {
              "model": model,
              "max_tokens": 64,
              "temperature": 1.0,
              "top_p": 0.95,
              "tools": [tool],
              "tool_choice": {"type": "none"},
              "messages": [
                  {"role": "user", "content": "Call get_probe_value exactly once."},
                  {"role": "assistant", "content": content},
                  {"role": "user", "content": [{"type": "tool_result", "tool_use_id": tool_use["id"], "content": "42"}]},
              ],
          }
          with open(followup_path, "w", encoding="utf-8") as handle:
              json.dump(followup, handle)
          print("agentinterposer_messages_tool_use_schema=ok")
          PY

          followup_status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$followup_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$followup_request")"
          echo "agentinterposer_messages_tool_result_http=${followup_status}"
          if [[ ! "$followup_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages tool-result continuation failed.' >&2
            exit 1
          fi
          python3 - "$followup_response" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("type") != "message" or data.get("role") != "assistant":
              raise SystemExit("Messages final response has an unexpected envelope")
          if data.get("stop_reason") not in {"end_turn", "max_tokens"}:
              raise SystemExit("Messages final response has an unexpected stop_reason")
          content = data.get("content")
          if not isinstance(content, list) or not any(isinstance(block, dict) and block.get("type") == "text" for block in content):
              raise SystemExit("Messages final response contains no text block")
          print("agentinterposer_messages_tool_result_round_trip=ok")
          PY
          echo 'messages_adapter_verified=true' >> "$GITHUB_OUTPUT"

      - name: Probe AgentInterposer vision routing
        if: ${{ inputs.scope == 'messages-vision' || inputs.scope == 'messages-vision-fallback' || inputs.scope == 'chat-vision-fallback' }}
        id: messages_vision_gateway
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
          FALLBACK_MODEL: ${{ inputs.fallback_model }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer-messages-vision"
          log="$RUNNER_TEMP/agentinterposer-messages-vision.log"
          request="$(mktemp)"
          response="$(mktemp)"
          expected="$(mktemp)"
          pid=''

          cleanup() {
            rm -f "$request" "$response" "$expected" "$binary" "$log"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          fallback_models=''
          if [ "$SCOPE" = 'messages-vision-fallback' ] || [ "$SCOPE" = 'chat-vision-fallback' ]; then
            if [ -z "$FALLBACK_MODEL" ]; then
              echo "$SCOPE requires fallback_model." >&2
              exit 2
            fi
            fallback_models="$FALLBACK_MODEL"
          fi

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            AGENTINTERPOSER_FALLBACK_MODELS="$fallback_models" \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Messages vision probe.' >&2
            exit 1
          fi

          python3 - "$MODEL" "$request" "$expected" "$SCOPE" <<'PY'
          import base64
          import binascii
          import json
          import secrets
          import struct
          import sys
          import zlib

          model, request_path, expected_path, scope = sys.argv[1:]
          red_side = secrets.choice(("LEFT", "RIGHT"))
          width, height = 128, 64
          red = bytes((255, 0, 0))
          blue = bytes((0, 0, 255))
          left, right = (red, blue) if red_side == "LEFT" else (blue, red)
          rows = []
          for _ in range(height):
              rows.append(b"\x00" + left * (width // 2) + right * (width // 2))

          def chunk(kind, payload):
              return struct.pack(">I", len(payload)) + kind + payload + struct.pack(">I", binascii.crc32(kind + payload) & 0xFFFFFFFF)

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
              + chunk(b"IEND", b"")
          )
          image_data = base64.b64encode(png).decode("ascii")
          prompt = "Which half of the image is red? Reply with exactly LEFT or RIGHT and no other text."
          if scope == "chat-vision-fallback":
              payload = {
                  "model": model,
                  "max_tokens": 8,
                  "messages": [{
                      "role": "user",
                      "content": [
                          {"type": "text", "text": prompt},
                          {
                              "type": "image_url",
                              "image_url": {"url": "data:image/png;base64," + image_data},
                          },
                      ],
                  }],
              }
          else:
              payload = {
                  "model": model,
                  "max_tokens": 8,
                  "messages": [{
                      "role": "user",
                      "content": [
                          {
                              "type": "image",
                              "source": {
                                  "type": "base64",
                                  "media_type": "image/png",
                                  "data": image_data,
                              },
                          },
                          {"type": "text", "text": prompt},
                      ],
                  }],
              }
          with open(request_path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, separators=(",", ":"))
          with open(expected_path, "w", encoding="utf-8") as handle:
              handle.write(red_side + "\n")
          print("agentinterposer_messages_vision_fixture=ok")
          PY

          endpoint='http://127.0.0.1:11435/v1/messages'
          if [ "$SCOPE" = 'chat-vision-fallback' ]; then
            endpoint='http://127.0.0.1:11435/v1/chat/completions'
          fi

          status="$(curl --silent --show-error \
            --max-time 180 \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            "$endpoint" \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$request")"
          echo "agentinterposer_messages_vision_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages vision probe failed.' >&2
            exit 1
          fi

          python3 - "$response" "$expected" "$SCOPE" "$MODEL" "$FALLBACK_MODEL" <<'PY'
          import json
          import re
          import sys

          response_path, expected_path, scope, model, fallback_model = sys.argv[1:]
          data = json.load(open(response_path, encoding="utf-8"))
          expected_model = fallback_model if scope in {"messages-vision-fallback", "chat-vision-fallback"} else model
          if data.get("model") != expected_model:
              raise SystemExit("Vision response did not report the expected routed model")

          if scope == "chat-vision-fallback":
              choices = data.get("choices")
              if not isinstance(choices, list) or len(choices) != 1 or not isinstance(choices[0], dict):
                  raise SystemExit("Chat vision response has an unexpected choices envelope")
              choice = choices[0]
              message = choice.get("message")
              if not isinstance(message, dict) or not isinstance(message.get("content"), str):
                  raise SystemExit("Chat vision response contains no assistant text")
              text = message["content"].strip().upper()
              if choice.get("finish_reason") not in {"stop", "length"}:
                  raise SystemExit("Chat vision response has an unexpected finish_reason")
          else:
              if data.get("type") != "message" or data.get("role") != "assistant":
                  raise SystemExit("Messages vision response has an unexpected envelope")
              content = data.get("content")
              if not isinstance(content, list):
                  raise SystemExit("Messages vision response content is not a list")
              text = "".join(
                  block.get("text", "")
                  for block in content
                  if isinstance(block, dict) and block.get("type") == "text"
              ).strip().upper()
              if data.get("stop_reason") not in {"end_turn", "max_tokens"}:
                  raise SystemExit("Messages vision response has an unexpected stop_reason")

          expected = open(expected_path, encoding="utf-8").read().strip().upper()
          directions = re.findall(r"\b(?:LEFT|RIGHT)\b", text)
          if not directions or len(set(directions)) != 1:
              raise SystemExit("Vision response did not contain one unambiguous direction")
          if directions[0] != expected:
              raise SystemExit("Vision response did not match the randomized image fixture")
          print("agentinterposer_vision_image_read=ok")
          print("messages_vision_verified=true")
          PY
          echo 'messages_vision_verified=true' >> "$GITHUB_OUTPUT"

      - name: Probe AgentInterposer Messages streaming adapter
        if: ${{ inputs.scope == 'messages-stream' }}
        id: messages_stream_gateway
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer-messages-stream"
          log="$RUNNER_TEMP/agentinterposer-messages-stream.log"
          text_request="$(mktemp)"
          text_response="$(mktemp)"
          text_headers="$(mktemp)"
          tool_request="$(mktemp)"
          tool_response="$(mktemp)"
          tool_headers="$(mktemp)"
          pid=''

          cleanup() {
            rm -f "$text_request" "$text_response" "$text_headers" "$tool_request" "$tool_response" "$tool_headers"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Messages streaming probe.' >&2
            exit 1
          fi

          python3 - "$MODEL" "$text_request" "$tool_request" <<'PY'
          import json
          import sys

          model, text_path, tool_path = sys.argv[1:]
          with open(text_path, "w", encoding="utf-8") as handle:
              json.dump({
                  "model": model,
                  "max_tokens": 32,
                  "stream": True,
                  "messages": [{"role": "user", "content": "Reply briefly with OK."}],
              }, handle)

          with open(tool_path, "w", encoding="utf-8") as handle:
              json.dump({
                  "model": model,
                  "max_tokens": 96,
                  "stream": True,
                  "tools": [{
                      "name": "get_probe_value",
                      "description": "Return a deterministic probe value supplied by the client.",
                      "input_schema": {"type": "object", "properties": {}, "additionalProperties": False},
                  }],
                  "tool_choice": {"type": "tool", "name": "get_probe_value", "disable_parallel_tool_use": True},
                  "messages": [{"role": "user", "content": "Call get_probe_value exactly once."}],
              }, handle)
          PY

          text_status="$(curl --silent --show-error --no-buffer \
            --max-time 120 \
            --dump-header "$text_headers" \
            --output "$text_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$text_request")"
          echo "agentinterposer_messages_stream_text_http=${text_status}"
          if [[ ! "$text_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages text streaming probe failed.' >&2
            exit 1
          fi

          python3 - "$text_headers" "$text_response" <<'PY'
          import json
          import sys

          headers_path, response_path = sys.argv[1:]
          headers = open(headers_path, encoding="utf-8", errors="replace").read().lower()
          if "content-type: text/event-stream" not in headers:
              raise SystemExit("Messages text stream did not return text/event-stream")

          def events(path):
              result = []
              name = None
              data = []
              for raw in open(path, encoding="utf-8"):
                  line = raw.rstrip("\r\n")
                  if not line:
                      if name and data:
                          result.append((name, json.loads("\n".join(data))))
                      name, data = None, []
                      continue
                  if line.startswith("event: "):
                      name = line[7:]
                  elif line.startswith("data: "):
                      data.append(line[6:])
              if name and data:
                  result.append((name, json.loads("\n".join(data))))
              return result

          stream = events(response_path)
          names = [name for name, _ in stream]
          if not names or names[0] != "message_start" or names[-1] != "message_stop":
              raise SystemExit("Messages text stream has an invalid envelope")
          text_deltas = [data for name, data in stream if name == "content_block_delta" and data.get("delta", {}).get("type") == "text_delta"]
          if not text_deltas or not any(isinstance(item.get("delta", {}).get("text"), str) and item["delta"]["text"] for item in text_deltas):
              raise SystemExit("Messages text stream contains no non-empty text_delta")
          message_delta = next((data for name, data in reversed(stream) if name == "message_delta"), None)
          if not message_delta or message_delta.get("delta", {}).get("stop_reason") not in {"end_turn", "max_tokens"}:
              raise SystemExit("Messages text stream has an invalid terminal stop_reason")
          usage = message_delta.get("usage")
          if not isinstance(usage, dict) or not isinstance(usage.get("input_tokens"), int) or usage["input_tokens"] <= 0 or not isinstance(usage.get("output_tokens"), int) or usage["output_tokens"] <= 0:
              raise SystemExit("Messages text stream did not receive terminal upstream usage")
          print("agentinterposer_messages_stream_text_schema=ok")
          print("agentinterposer_messages_stream_usage=ok")
          PY

          tool_status="$(curl --silent --show-error --no-buffer \
            --max-time 120 \
            --dump-header "$tool_headers" \
            --output "$tool_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$tool_request")"
          echo "agentinterposer_messages_stream_tool_http=${tool_status}"
          if [[ ! "$tool_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages tool streaming probe failed.' >&2
            exit 1
          fi

          python3 - "$tool_headers" "$tool_response" <<'PY'
          import json
          import sys

          headers_path, response_path = sys.argv[1:]
          headers = open(headers_path, encoding="utf-8", errors="replace").read().lower()
          if "content-type: text/event-stream" not in headers:
              raise SystemExit("Messages tool stream did not return text/event-stream")

          stream = []
          name = None
          data = []
          for raw in open(response_path, encoding="utf-8"):
              line = raw.rstrip("\r\n")
              if not line:
                  if name and data:
                      stream.append((name, json.loads("\n".join(data))))
                  name, data = None, []
                  continue
              if line.startswith("event: "):
                  name = line[7:]
              elif line.startswith("data: "):
                  data.append(line[6:])
          if name and data:
              stream.append((name, json.loads("\n".join(data))))

          starts = [(data.get("index"), data.get("content_block")) for name, data in stream if name == "content_block_start"]
          tool_start = next(((index, block) for index, block in starts if isinstance(block, dict) and block.get("type") == "tool_use" and block.get("name") == "get_probe_value"), None)
          if not tool_start:
              raise SystemExit("Messages tool stream contains no get_probe_value tool_use block")
          tool_index, tool_block = tool_start
          if not isinstance(tool_block.get("id"), str) or not tool_block["id"] or tool_block.get("input") != {}:
              raise SystemExit("Messages tool stream has an invalid tool_use start block")
          partials = [data.get("delta", {}).get("partial_json", "") for name, data in stream if name == "content_block_delta" and data.get("index") == tool_index and data.get("delta", {}).get("type") == "input_json_delta"]
          if not partials:
              raise SystemExit("Messages tool stream contains no input_json_delta")
          parsed = json.loads("".join(partials))
          if not isinstance(parsed, dict):
              raise SystemExit("Messages tool stream input_json_delta did not form an object")
          message_delta = next((data for name, data in reversed(stream) if name == "message_delta"), None)
          if not message_delta or message_delta.get("delta", {}).get("stop_reason") != "tool_use":
              raise SystemExit("Messages tool stream did not stop for tool_use")
          if not stream or stream[-1][0] != "message_stop":
              raise SystemExit("Messages tool stream did not terminate with message_stop")
          print("agentinterposer_messages_stream_tool_use=ok")
          print("agentinterposer_messages_stream_tool_json=ok")
          PY
          echo 'messages_stream_verified=true' >> "$GITHUB_OUTPUT"

      - name: Install Claude Code certification client
        if: ${{ inputs.scope == 'claude-code' || inputs.scope == 'claude-code-error' || inputs.scope == 'claude-code-loop' }}
        id: claude_install
        shell: bash
        run: |
          set -euo pipefail
          root='/tmp/agentinterposer-claude-client'
          cache="$RUNNER_TEMP/claude-npm-cache"
          expected_integrity='sha512-zDdtV2tzCfngxKXJLj5/UYHtCVa/yA/L0vF5dBx3w1dx5tcA8+AlyRp3qcsd/gYU7hbI/gS5OoA7C8XqJR9YtA=='
          rm -rf "$root" "$cache"
          mkdir -p "$root" "$cache"
          chmod 0755 "$root"

          package="$(cd "$root" && npm --cache "$cache" pack --ignore-scripts --silent @anthropic-ai/claude-code-linux-x64@2.1.226 | tail -1)"
          package_path="$root/$package"
          python3 - "$package_path" "$expected_integrity" <<'PY'
          import base64
          import hashlib
          import sys

          path, expected = sys.argv[1:]
          actual = "sha512-" + base64.b64encode(hashlib.sha512(open(path, "rb").read()).digest()).decode()
          if actual != expected:
              raise SystemExit("Claude Code native package integrity mismatch")
          print("claude_code_package_integrity=ok")
          PY

          tar -xOf "$package_path" package/claude > "$root/claude"
          chmod 0755 "$root/claude"
          rm -f "$package_path"
          claude_bin="$root/claude"
          version="$($claude_bin --version)"
