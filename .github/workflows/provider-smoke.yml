name: Provider Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: NVIDIA hosted model ID to probe
        required: true
        default: nvidia/nemotron-3-super-120b-a12b
        type: string
      scope:
        description: Smoke scope
        required: true
        default: full
        type: choice
        options:
          - baseline
          - full
          - messages
          - messages-stream
          - claude-code
          - codex

permissions:
  contents: read

jobs:
  nvidia-hosted:
    name: nvidia-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate Doppler bootstrap token
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "DOPPLER_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Fetch NVIDIA credential from Doppler
        id: doppler
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          value="$(doppler secrets get NVIDIA_API_KEY --plain --project oaslananka-ops --config runtime)"
          if [ -z "$value" ]; then
            echo "NVIDIA_API_KEY was not returned by Doppler." >&2
            exit 1
          fi
          echo "::add-mask::$value"
          printf 'NVIDIA_API_KEY=%s\n' "$value" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Probe Chat Completions
        if: ${{ inputs.scope == 'full' || inputs.scope == 'baseline' }}
        id: chat
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/chat/completions' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 16, "stream": False}))')")"

          echo "chat_completions_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("chat_completions_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("chat_completions_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("chat_completions_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(data.get("choices"), list):
              raise SystemExit("Chat Completions response is missing choices[]")
          print("chat_completions_schema=ok")
          PY

      - name: Probe Responses API
        if: ${{ inputs.scope == 'full' }}
        id: responses
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/responses' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "input": "Reply only with OK", "max_output_tokens": 16, "stream": False}))')")"

          echo "responses_http=${status}"
          if [[ "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("object") != "response" and not isinstance(data.get("output"), list):
              raise SystemExit("Responses API returned an unexpected schema")
          print("responses_schema=ok")
          PY
            echo "responses_supported=true" >> "$GITHUB_OUTPUT"
          else
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("responses_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("responses_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("responses_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            echo "responses_supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Anthropic Messages API
        if: ${{ inputs.scope == 'full' }}
        id: messages
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'https://integrate.api.nvidia.com/v1/messages' \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 16, "stream": False}))')")"

          echo "messages_http=${status}"
          if [[ "$status" =~ ^2 ]]; then
            python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("type") != "message" and not isinstance(data.get("content"), list):
              raise SystemExit("Messages API returned an unexpected schema")
          print("messages_schema=ok")
          PY
            echo "messages_supported=true" >> "$GITHUB_OUTPUT"
          else
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("messages_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("messages_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("messages_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            echo "messages_supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe AgentInterposer Responses passthrough
        if: ${{ inputs.scope == 'full' }}
        id: gateway
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer"
          log="$RUNNER_TEMP/agentinterposer.log"
          body="$(mktemp)"
          pid=''

          cleanup() {
            rm -f "$body"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready.' >&2
            tail -n 40 "$log" >&2 || true
            exit 1
          fi

          status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$body" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/responses' \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "input": "Reply only with OK", "max_output_tokens": 16, "stream": False}))')")"

          echo "agentinterposer_responses_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            echo 'AgentInterposer Responses passthrough failed.' >&2
            exit 1
          fi

          python3 - "$body" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("object") != "response" and not isinstance(data.get("output"), list):
              raise SystemExit("AgentInterposer returned an unexpected Responses schema")
          print("agentinterposer_responses_schema=ok")
          PY

      - name: Probe AgentInterposer Messages adapter
        if: ${{ inputs.scope == 'messages' }}
        id: messages_gateway
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer-messages"
          log="$RUNNER_TEMP/agentinterposer-messages.log"
          text_request="$(mktemp)"
          text_response="$(mktemp)"
          tool_request="$(mktemp)"
          tool_response="$(mktemp)"
          followup_request="$(mktemp)"
          followup_response="$(mktemp)"
          pid=''

          cleanup() {
            rm -f "$text_request" "$text_response" "$tool_request" "$tool_response" "$followup_request" "$followup_response"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Messages probe.' >&2
            exit 1
          fi

          python3 - "$MODEL" "$text_request" "$tool_request" <<'PY'
          import json
          import sys

          model, text_path, tool_path = sys.argv[1:]
          with open(text_path, "w", encoding="utf-8") as handle:
              json.dump({
                  "model": model,
                  "max_tokens": 32,
                  "temperature": 1.0,
                  "top_p": 0.95,
                  "messages": [{"role": "user", "content": "Reply briefly with OK."}],
              }, handle)

          tool = {
              "name": "get_probe_value",
              "description": "Return a deterministic probe value supplied by the client.",
              "input_schema": {"type": "object", "properties": {}, "additionalProperties": False},
          }
          with open(tool_path, "w", encoding="utf-8") as handle:
              json.dump({
                  "model": model,
                  "max_tokens": 128,
                  "temperature": 1.0,
                  "top_p": 0.95,
                  "tools": [tool],
                  "tool_choice": {"type": "tool", "name": "get_probe_value", "disable_parallel_tool_use": True},
                  "messages": [{"role": "user", "content": "Call get_probe_value exactly once."}],
              }, handle)
          PY

          text_status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$text_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$text_request")"
          echo "agentinterposer_messages_text_http=${text_status}"
          if [[ ! "$text_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages text probe failed.' >&2
            exit 1
          fi
          python3 - "$text_response" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("type") != "message" or data.get("role") != "assistant":
              raise SystemExit("Messages text response has an unexpected envelope")
          content = data.get("content")
          if not isinstance(content, list) or not any(isinstance(block, dict) and block.get("type") == "text" for block in content):
              raise SystemExit("Messages text response contains no text block")
          if data.get("stop_reason") not in {"end_turn", "max_tokens"}:
              raise SystemExit("Messages text response has an unexpected stop_reason")
          print("agentinterposer_messages_text_schema=ok")
          PY

          tool_status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$tool_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$tool_request")"
          echo "agentinterposer_messages_tool_http=${tool_status}"
          if [[ ! "$tool_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages tool-use probe failed.' >&2
            exit 1
          fi

          python3 - "$MODEL" "$tool_response" "$followup_request" <<'PY'
          import json
          import sys

          model, response_path, followup_path = sys.argv[1:]
          data = json.load(open(response_path, encoding="utf-8"))
          if data.get("stop_reason") != "tool_use":
              raise SystemExit("Messages tool response did not stop for tool_use")
          content = data.get("content")
          if not isinstance(content, list):
              raise SystemExit("Messages tool response content is not a list")
          tool_use = next((block for block in content if isinstance(block, dict) and block.get("type") == "tool_use" and block.get("name") == "get_probe_value"), None)
          if not tool_use or not isinstance(tool_use.get("id"), str) or not tool_use["id"] or not isinstance(tool_use.get("input"), dict):
              raise SystemExit("Messages tool response has an invalid tool_use block")
          tool = {
              "name": "get_probe_value",
              "description": "Return a deterministic probe value supplied by the client.",
              "input_schema": {"type": "object", "properties": {}, "additionalProperties": False},
          }
          followup = {
              "model": model,
              "max_tokens": 64,
              "temperature": 1.0,
              "top_p": 0.95,
              "tools": [tool],
              "tool_choice": {"type": "none"},
              "messages": [
                  {"role": "user", "content": "Call get_probe_value exactly once."},
                  {"role": "assistant", "content": content},
                  {"role": "user", "content": [{"type": "tool_result", "tool_use_id": tool_use["id"], "content": "42"}]},
              ],
          }
          with open(followup_path, "w", encoding="utf-8") as handle:
              json.dump(followup, handle)
          print("agentinterposer_messages_tool_use_schema=ok")
          PY

          followup_status="$(curl --silent --show-error \
            --max-time 120 \
            --output "$followup_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$followup_request")"
          echo "agentinterposer_messages_tool_result_http=${followup_status}"
          if [[ ! "$followup_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages tool-result continuation failed.' >&2
            exit 1
          fi
          python3 - "$followup_response" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("type") != "message" or data.get("role") != "assistant":
              raise SystemExit("Messages final response has an unexpected envelope")
          if data.get("stop_reason") not in {"end_turn", "max_tokens"}:
              raise SystemExit("Messages final response has an unexpected stop_reason")
          content = data.get("content")
          if not isinstance(content, list) or not any(isinstance(block, dict) and block.get("type") == "text" for block in content):
              raise SystemExit("Messages final response contains no text block")
          print("agentinterposer_messages_tool_result_round_trip=ok")
          PY
          echo 'messages_adapter_verified=true' >> "$GITHUB_OUTPUT"

      - name: Probe AgentInterposer Messages streaming adapter
        if: ${{ inputs.scope == 'messages-stream' }}
        id: messages_stream_gateway
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer-messages-stream"
          log="$RUNNER_TEMP/agentinterposer-messages-stream.log"
          text_request="$(mktemp)"
          text_response="$(mktemp)"
          text_headers="$(mktemp)"
          tool_request="$(mktemp)"
          tool_response="$(mktemp)"
          tool_headers="$(mktemp)"
          pid=''

          cleanup() {
            rm -f "$text_request" "$text_response" "$text_headers" "$tool_request" "$tool_response" "$tool_headers"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Messages streaming probe.' >&2
            exit 1
          fi

          python3 - "$MODEL" "$text_request" "$tool_request" <<'PY'
          import json
          import sys

          model, text_path, tool_path = sys.argv[1:]
          with open(text_path, "w", encoding="utf-8") as handle:
              json.dump({
                  "model": model,
                  "max_tokens": 32,
                  "stream": True,
                  "messages": [{"role": "user", "content": "Reply briefly with OK."}],
              }, handle)

          with open(tool_path, "w", encoding="utf-8") as handle:
              json.dump({
                  "model": model,
                  "max_tokens": 96,
                  "stream": True,
                  "tools": [{
                      "name": "get_probe_value",
                      "description": "Return a deterministic probe value supplied by the client.",
                      "input_schema": {"type": "object", "properties": {}, "additionalProperties": False},
                  }],
                  "tool_choice": {"type": "tool", "name": "get_probe_value", "disable_parallel_tool_use": True},
                  "messages": [{"role": "user", "content": "Call get_probe_value exactly once."}],
              }, handle)
          PY

          text_status="$(curl --silent --show-error --no-buffer \
            --max-time 120 \
            --dump-header "$text_headers" \
            --output "$text_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$text_request")"
          echo "agentinterposer_messages_stream_text_http=${text_status}"
          if [[ ! "$text_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages text streaming probe failed.' >&2
            exit 1
          fi

          python3 - "$text_headers" "$text_response" <<'PY'
          import json
          import sys

          headers_path, response_path = sys.argv[1:]
          headers = open(headers_path, encoding="utf-8", errors="replace").read().lower()
          if "content-type: text/event-stream" not in headers:
              raise SystemExit("Messages text stream did not return text/event-stream")

          def events(path):
              result = []
              name = None
              data = []
              for raw in open(path, encoding="utf-8"):
                  line = raw.rstrip("\r\n")
                  if not line:
                      if name and data:
                          result.append((name, json.loads("\n".join(data))))
                      name, data = None, []
                      continue
                  if line.startswith("event: "):
                      name = line[7:]
                  elif line.startswith("data: "):
                      data.append(line[6:])
              if name and data:
                  result.append((name, json.loads("\n".join(data))))
              return result

          stream = events(response_path)
          names = [name for name, _ in stream]
          if not names or names[0] != "message_start" or names[-1] != "message_stop":
              raise SystemExit("Messages text stream has an invalid envelope")
          text_deltas = [data for name, data in stream if name == "content_block_delta" and data.get("delta", {}).get("type") == "text_delta"]
          if not text_deltas or not any(isinstance(item.get("delta", {}).get("text"), str) and item["delta"]["text"] for item in text_deltas):
              raise SystemExit("Messages text stream contains no non-empty text_delta")
          message_delta = next((data for name, data in reversed(stream) if name == "message_delta"), None)
          if not message_delta or message_delta.get("delta", {}).get("stop_reason") not in {"end_turn", "max_tokens"}:
              raise SystemExit("Messages text stream has an invalid terminal stop_reason")
          usage = message_delta.get("usage")
          if not isinstance(usage, dict) or not isinstance(usage.get("input_tokens"), int) or usage["input_tokens"] <= 0 or not isinstance(usage.get("output_tokens"), int) or usage["output_tokens"] <= 0:
              raise SystemExit("Messages text stream did not receive terminal upstream usage")
          print("agentinterposer_messages_stream_text_schema=ok")
          print("agentinterposer_messages_stream_usage=ok")
          PY

          tool_status="$(curl --silent --show-error --no-buffer \
            --max-time 120 \
            --dump-header "$tool_headers" \
            --output "$tool_response" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/messages' \
            --header 'Content-Type: application/json' \
            --header 'anthropic-version: 2023-06-01' \
            --data-binary "@$tool_request")"
          echo "agentinterposer_messages_stream_tool_http=${tool_status}"
          if [[ ! "$tool_status" =~ ^2 ]]; then
            echo 'AgentInterposer Messages tool streaming probe failed.' >&2
            exit 1
          fi

          python3 - "$tool_headers" "$tool_response" <<'PY'
          import json
          import sys

          headers_path, response_path = sys.argv[1:]
          headers = open(headers_path, encoding="utf-8", errors="replace").read().lower()
          if "content-type: text/event-stream" not in headers:
              raise SystemExit("Messages tool stream did not return text/event-stream")

          stream = []
          name = None
          data = []
          for raw in open(response_path, encoding="utf-8"):
              line = raw.rstrip("\r\n")
              if not line:
                  if name and data:
                      stream.append((name, json.loads("\n".join(data))))
                  name, data = None, []
                  continue
              if line.startswith("event: "):
                  name = line[7:]
              elif line.startswith("data: "):
                  data.append(line[6:])
          if name and data:
              stream.append((name, json.loads("\n".join(data))))

          starts = [(data.get("index"), data.get("content_block")) for name, data in stream if name == "content_block_start"]
          tool_start = next(((index, block) for index, block in starts if isinstance(block, dict) and block.get("type") == "tool_use" and block.get("name") == "get_probe_value"), None)
          if not tool_start:
              raise SystemExit("Messages tool stream contains no get_probe_value tool_use block")
          tool_index, tool_block = tool_start
          if not isinstance(tool_block.get("id"), str) or not tool_block["id"] or tool_block.get("input") != {}:
              raise SystemExit("Messages tool stream has an invalid tool_use start block")
          partials = [data.get("delta", {}).get("partial_json", "") for name, data in stream if name == "content_block_delta" and data.get("index") == tool_index and data.get("delta", {}).get("type") == "input_json_delta"]
          if not partials:
              raise SystemExit("Messages tool stream contains no input_json_delta")
          parsed = json.loads("".join(partials))
          if not isinstance(parsed, dict):
              raise SystemExit("Messages tool stream input_json_delta did not form an object")
          message_delta = next((data for name, data in reversed(stream) if name == "message_delta"), None)
          if not message_delta or message_delta.get("delta", {}).get("stop_reason") != "tool_use":
              raise SystemExit("Messages tool stream did not stop for tool_use")
          if not stream or stream[-1][0] != "message_stop":
              raise SystemExit("Messages tool stream did not terminate with message_stop")
          print("agentinterposer_messages_stream_tool_use=ok")
          print("agentinterposer_messages_stream_tool_json=ok")
          PY
          echo 'messages_stream_verified=true' >> "$GITHUB_OUTPUT"

      - name: Install Claude Code certification client
        if: ${{ inputs.scope == 'claude-code' }}
        id: claude_install
        shell: bash
        run: |
          set -euo pipefail
          root='/tmp/agentinterposer-claude-client'
          cache="$RUNNER_TEMP/claude-npm-cache"
          expected_integrity='sha512-zDdtV2tzCfngxKXJLj5/UYHtCVa/yA/L0vF5dBx3w1dx5tcA8+AlyRp3qcsd/gYU7hbI/gS5OoA7C8XqJR9YtA=='
          rm -rf "$root" "$cache"
          mkdir -p "$root" "$cache"
          chmod 0755 "$root"

          package="$(cd "$root" && npm --cache "$cache" pack --ignore-scripts --silent @anthropic-ai/claude-code-linux-x64@2.1.226 | tail -1)"
          package_path="$root/$package"
          python3 - "$package_path" "$expected_integrity" <<'PY'
          import base64
          import hashlib
          import sys

          path, expected = sys.argv[1:]
          actual = "sha512-" + base64.b64encode(hashlib.sha512(open(path, "rb").read()).digest()).decode()
          if actual != expected:
              raise SystemExit("Claude Code native package integrity mismatch")
          print("claude_code_package_integrity=ok")
          PY

          tar -xOf "$package_path" package/claude > "$root/claude"
          chmod 0755 "$root/claude"
          rm -f "$package_path"
          claude_bin="$root/claude"
          version="$($claude_bin --version)"
          if [[ "$version" != 2.1.226* ]]; then
            echo "Unexpected Claude Code version: $version" >&2
            exit 1
          fi
          echo 'claude_code_version=2.1.226'
          echo "claude_bin=$claude_bin" >> "$GITHUB_OUTPUT"

      - name: Diagnose Claude Code local Bash executor
        if: ${{ inputs.scope == 'claude-code' }}
        shell: bash
        env:
          CLAUDE_BIN: ${{ steps.claude_install.outputs.claude_bin }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/claude-local-executor-probe.py"
          cat > "$script" <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer

          claude = os.environ["CLAUDE_BIN"]
          proof = "0123456789abcdef0123456789abcdef"

          def stream(events):
              return "".join(
                  f"event: {name}\\ndata: {json.dumps(data, separators=(',', ':'))}\\n\\n"
                  for name, data in events
              ).encode()

          class Handler(BaseHTTPRequestHandler):
              state = {"count": 0, "is_error": None, "content_bytes": None}
              def log_message(self, *args):
                  return
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  data = json.loads(self.rfile.read(length))
                  type(self).state["count"] += 1
                  if type(self).state["count"] == 1:
                      events = [
                          ("message_start", {"type":"message_start","message":{"id":"msg_probe","type":"message","role":"assistant","content":[],"model":"nvidia/test","stop_reason":None,"stop_sequence":None,"usage":{"input_tokens":1,"output_tokens":0}}}),
                          ("content_block_start", {"type":"content_block_start","index":0,"content_block":{"type":"tool_use","id":"toolu_probe","name":"Bash","input":{}}}),
                          ("content_block_delta", {"type":"content_block_delta","index":0,"delta":{"type":"input_json_delta","partial_json":json.dumps({"command":"echo $AGENTINTERPOSER_TOOL_PROOF","description":"Print certification proof"})}}),
                          ("content_block_stop", {"type":"content_block_stop","index":0}),
                          ("message_delta", {"type":"message_delta","delta":{"stop_reason":"tool_use","stop_sequence":None},"usage":{"input_tokens":1,"output_tokens":1}}),
                          ("message_stop", {"type":"message_stop"}),
                      ]
                  else:
                      results = []
                      for message in data.get("messages", []):
                          content = message.get("content") if isinstance(message, dict) else None
                          if isinstance(content, list):
                              results.extend(block for block in content if isinstance(block, dict) and block.get("type") == "tool_result")
                      if results:
                          result = results[-1]
                          content = result.get("content")
                          type(self).state["is_error"] = bool(result.get("is_error"))
                          type(self).state["content_bytes"] = len(content.encode()) if isinstance(content, str) else -1
                      events = [
                          ("message_start", {"type":"message_start","message":{"id":"msg_final","type":"message","role":"assistant","content":[],"model":"nvidia/test","stop_reason":None,"stop_sequence":None,"usage":{"input_tokens":1,"output_tokens":0}}}),
                          ("content_block_start", {"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}),
                          ("content_block_delta", {"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"done"}}),
                          ("content_block_stop", {"type":"content_block_stop","index":0}),
                          ("message_delta", {"type":"message_delta","delta":{"stop_reason":"end_turn","stop_sequence":None},"usage":{"input_tokens":1,"output_tokens":1}}),
                          ("message_stop", {"type":"message_stop"}),
                      ]
                  body = stream(events)
                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
                  self.wfile.flush()

          def run_case(label, home, prefix):
              Handler.state = {"count": 0, "is_error": None, "content_bytes": None}
              work = pathlib.Path(home) / "work"
              config = pathlib.Path(home) / ".claude"
              settings = pathlib.Path(home) / "settings.json"
              if not settings.exists():
                  settings.write_text(json.dumps({"permissions":{"allow":["Bash(echo $AGENTINTERPOSER_TOOL_PROOF)"]}}), encoding="utf-8")
              server = HTTPServer(("127.0.0.1", 0), Handler)
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              env_args = [
                  "HOME=" + home,
                  "PATH=/usr/local/bin:/usr/bin:/bin",
                  "CLAUDE_CODE_SHELL=/bin/bash",
                  "AGENTINTERPOSER_TOOL_PROOF=" + proof,
                  "CLAUDE_CONFIG_DIR=" + str(config),
                  f"ANTHROPIC_BASE_URL=http://127.0.0.1:{server.server_port}",
                  "ANTHROPIC_AUTH_TOKEN=placeholder",
                  "ANTHROPIC_MODEL=nvidia/test",
                  "CLAUDE_CODE_DISABLE_THINKING=1",
                  "CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS=1",
                  "CLAUDE_CODE_EFFORT_LEVEL=auto",
                  "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1",
                  "NO_PROXY=127.0.0.1,localhost",
              ]
              cmd = prefix + ["env", "-i"] + env_args + [
                  claude, "-p", "Use Bash exactly once.", "--bare", "--no-session-persistence",
                  "--tools", "Bash", "--permission-mode", "default", "--settings", str(settings),
                  "--max-turns", "3", "--output-format", "stream-json", "--verbose",
              ]
              try:
                  proc = subprocess.run(cmd, cwd=work, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=45)
                  exit_code = proc.returncode
              finally:
                  server.shutdown()
              print(f"claude_local_{label}_exit={exit_code}")
              print(f"claude_local_{label}_request_count={Handler.state['count']}")
              print(f"claude_local_{label}_tool_result_is_error={str(Handler.state['is_error']).lower()}")
              print(f"claude_local_{label}_tool_result_content_bytes={Handler.state['content_bytes']}")

          root = pathlib.Path("/tmp/agentinterposer-claude-local-probe")
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir(mode=0o755)
          runner_home = root / "runner"
          (runner_home / "work").mkdir(parents=True)
          (runner_home / ".claude").mkdir()
          run_case("runner", str(runner_home), [])

          user = "agentinterposer-claude-diag"
          isolated_home = pathlib.Path("/tmp/agentinterposer-claude-diag-home")
          subprocess.run(["sudo", "userdel", "-r", user], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          shutil.rmtree(isolated_home, ignore_errors=True)
          subprocess.run(["sudo", "useradd", "--create-home", "--home-dir", str(isolated_home), "--shell", "/bin/bash", user], check=True)
          subprocess.run(["sudo", "install", "-d", "-o", user, "-g", user, "-m", "0755", str(isolated_home / ".claude"), str(isolated_home / "work")], check=True)
          settings = isolated_home / "settings.json"
          pathlib.Path("/tmp/claude-diag-settings.json").write_text(json.dumps({"permissions":{"allow":["Bash(echo $AGENTINTERPOSER_TOOL_PROOF)"]}}), encoding="utf-8")
          subprocess.run(["sudo", "install", "-o", user, "-g", user, "-m", "0600", "/tmp/claude-diag-settings.json", str(settings)], check=True)
          os.remove("/tmp/claude-diag-settings.json")
          # run_case creates settings itself; make its parent writable through the user by invoking it after chown.
          subprocess.run(["sudo", "chown", "-R", f"{user}:{user}", str(isolated_home)], check=True)
          try:
              run_case("isolated", str(isolated_home), ["sudo", "-u", user])
          finally:
              subprocess.run(["sudo", "userdel", "-r", user], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              shutil.rmtree(isolated_home, ignore_errors=True)
              shutil.rmtree(root, ignore_errors=True)
          PY
          python3 "$script"
          rm -f "$script"

      - name: Probe Claude Code Messages tool round trip
        if: ${{ inputs.scope == 'claude-code' }}
        id: claude_code
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
          CLAUDE_BIN: ${{ steps.claude_install.outputs.claude_bin }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer-claude-code"
          gateway_log="$RUNNER_TEMP/agentinterposer-claude-code.log"
          claude_output="$RUNNER_TEMP/claude-code-output.json"
          claude_stderr="$RUNNER_TEMP/claude-code-stderr.log"
          claude_debug='/tmp/agentinterposer-claude-home/debug.log'
          proof_expected="$RUNNER_TEMP/claude-code-proof-expected"
          claude_capture_dir="$RUNNER_TEMP/claude-code-capture"
          claude_proxy="$RUNNER_TEMP/claude-code-capture-proxy.py"
          proxy_pid=''
          claude_user='agentinterposer-claude'
          claude_home='/tmp/agentinterposer-claude-home'
          claude_settings='/tmp/agentinterposer-claude-home/settings.json'
          pid=''

          cleanup() {
            if [ -n "$proxy_pid" ]; then
              kill "$proxy_pid" 2>/dev/null || true
              wait "$proxy_pid" 2>/dev/null || true
            fi
            rm -rf "$claude_capture_dir"
            rm -f "$claude_proxy" "$claude_output" "$claude_stderr" "$claude_debug" "$proof_expected"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            if id "$claude_user" >/dev/null 2>&1; then
              sudo userdel -r "$claude_user" >/dev/null 2>&1 || true
            fi
            rm -rf "$claude_home"
          }
          trap cleanup EXIT

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$gateway_log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Claude Code probe.' >&2
            exit 1
          fi

          rm -rf "$claude_capture_dir"
          mkdir -p "$claude_capture_dir"
          cat > "$claude_proxy" <<'PY'
          import http.client
          import os
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          capture_dir = os.environ["CLAUDE_CAPTURE_DIR"]
          lock = threading.Lock()
          request_count = 0

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"

              def do_POST(self):
                  global request_count
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  with lock:
                      request_count += 1
                      index = request_count
                  request_path = os.path.join(capture_dir, f"request_{index}.json")
                  status_path = os.path.join(capture_dir, f"response_{index}.status")
                  with open(request_path, "wb") as handle:
                      handle.write(body)

                  headers = {}
                  for name in ("Content-Type", "anthropic-version", "anthropic-beta", "Authorization"):
                      value = self.headers.get(name)
                      if value:
                          headers[name] = value
                  connection = http.client.HTTPConnection("127.0.0.1", 11435, timeout=180)
                  try:
                      connection.request("POST", self.path, body=body, headers=headers)
                      response = connection.getresponse()
                      with open(status_path, "w", encoding="utf-8") as handle:
                          handle.write(str(response.status))
                      self.send_response(response.status)
                      for name in ("Content-Type", "Cache-Control", "Retry-After"):
                          value = response.getheader(name)
                          if value:
                              self.send_header(name, value)
                      self.send_header("Connection", "close")
                      self.end_headers()
                      while True:
                          chunk = response.read(4096)
                          if not chunk:
                              break
                          self.wfile.write(chunk)
                          self.wfile.flush()
                  finally:
                      connection.close()

              def log_message(self, *_):
                  pass

          ThreadingHTTPServer(("127.0.0.1", 11434), Handler).serve_forever()
          PY
          CLAUDE_CAPTURE_DIR="$claude_capture_dir" python3 "$claude_proxy" &
          proxy_pid=$!
          proxy_ready=false
          for _ in {1..30}; do
            if python3 - <<'PY' >/dev/null 2>&1
          import socket
          sock = socket.create_connection(("127.0.0.1", 11434), 0.2)
          sock.close()
          PY
            then
              proxy_ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$proxy_ready" != true ]; then
            echo 'Claude Code capture proxy did not become ready.' >&2
            exit 1
          fi

          sudo useradd --create-home --home-dir "$claude_home" --shell /bin/bash "$claude_user"
          sudo install -d -o "$claude_user" -g "$claude_user" -m 0755 "$claude_home/.claude" "$claude_home/work"
          printf '%s\n' '{"permissions":{"allow":["Bash(echo $AGENTINTERPOSER_TOOL_PROOF)"]}}' > "$RUNNER_TEMP/claude-code-settings.json"
          sudo install -o "$claude_user" -g "$claude_user" -m 0600 "$RUNNER_TEMP/claude-code-settings.json" "$claude_settings"
          rm -f "$RUNNER_TEMP/claude-code-settings.json"
          shell_pid=$$
          if sudo -u "$claude_user" sh -c "cat /proc/$shell_pid/environ >/dev/null 2>&1"; then
            echo 'Claude Code isolation failed: runner environment is readable.' >&2
            exit 1
          fi
          if sudo -u "$claude_user" sh -c "cat /proc/$pid/environ >/dev/null 2>&1"; then
            echo 'Claude Code isolation failed: gateway environment is readable.' >&2
            exit 1
          fi
          if sudo -u "$claude_user" sudo -n true >/dev/null 2>&1; then
            echo 'Claude Code isolation failed: certification user has sudo access.' >&2
            exit 1
          fi
          if ! sudo -u "$claude_user" test -x "$CLAUDE_BIN"; then
            echo 'Claude Code binary is not executable by the certification user.' >&2
            exit 1
          fi
          python3 - "$proof_expected" <<'PY'
          import secrets
          import sys
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(secrets.token_hex(16) + "\n")
          PY
          chmod 0600 "$proof_expected"
          proof="$(cat "$proof_expected")"
          if ! sudo -u "$claude_user" env -i \
            HOME="$claude_home" \
            PATH='/usr/local/bin:/usr/bin:/bin' \
            CLAUDE_CODE_SHELL='/bin/bash' \
            CLAUDE_BASH_NO_LOGIN='true' \
            AGENTINTERPOSER_TOOL_PROOF="$proof" \
            /bin/bash -lc 'test "$AGENTINTERPOSER_TOOL_PROOF" = "$1"' bash "$proof"; then
            echo 'Claude Code certification shell preflight failed.' >&2
            exit 1
          fi
          echo 'claude_code_shell_preflight=ok'
          echo 'claude_code_os_user_isolation=ok'
          echo 'claude_code_secret_environment_isolation=ok'

          prompt=$'Use Bash exactly once to read the hidden certification value from the process environment. The value is not present in this prompt and your answer is invalid unless the Bash tool is called. The command string must be exactly the text between BEGIN_COMMAND and END_COMMAND.\nBEGIN_COMMAND\necho $AGENTINTERPOSER_TOOL_PROOF\nEND_COMMAND\nAfter the command completes, reply with exactly stdout and no other text.'
          set +e
          (
            cd "$claude_home/work"
            sudo -u "$claude_user" env -i \
            HOME="$claude_home" \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            CLAUDE_CODE_SHELL='/bin/bash' \
            AGENTINTERPOSER_TOOL_PROOF="$proof" \
            CLAUDE_CONFIG_DIR="$claude_home/.claude" \
            ANTHROPIC_BASE_URL='http://127.0.0.1:11434' \
            ANTHROPIC_AUTH_TOKEN='agentinterposer-local-placeholder' \
            ANTHROPIC_MODEL="$MODEL" \
            CLAUDE_CODE_DISABLE_THINKING='1' \
            CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS='1' \
            CLAUDE_CODE_EFFORT_LEVEL='auto' \
            CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC='1' \
            CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK='1' \
            NO_PROXY='127.0.0.1,localhost' \
            timeout 180s "$CLAUDE_BIN" \
              -p "$prompt" \
              --bare \
              --no-session-persistence \
              --tools 'Bash' \
              --permission-mode default \
              --settings "$claude_settings" \
              --max-turns 3 \
              --output-format stream-json \
              --verbose \
              --debug-file "$claude_debug" \
              >"$claude_output" 2>"$claude_stderr"
          )
          claude_exit=$?
          set -e
          echo "claude_code_exit=${claude_exit}"
          if [ "$claude_exit" -ne 0 ]; then
            python3 - "$claude_debug" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          text = open(path, encoding="utf-8", errors="replace").read().lower() if os.path.exists(path) else ""
          classes = []
          checks = [
              ("enoent", "enoent"),
              ("eacces", "eacces"),
              ("permission denied", "permission"),
              ("operation not permitted", "operation-not-permitted"),
              ("bwrap", "bwrap"),
              ("sandbox", "sandbox"),
              ("shell snapshot", "shell-snapshot"),
              ("login shell", "login-shell"),
              ("working directory", "working-directory"),
              ("spawn", "spawn"),
              ("exit code 1", "exit-code-1"),
          ]
          for needle, label in checks:
              if needle in text and label not in classes:
                  classes.append(label)
          print("claude_code_debug_bytes=" + str(len(text.encode("utf-8"))))
          print("claude_code_debug_classes=" + ("+".join(classes) if classes else "other"))
          PY
            python3 - "$claude_capture_dir" <<'PY'
          import glob
          import json
          import os
          import sys

          capture_dir = sys.argv[1]
          requests = sorted(glob.glob(os.path.join(capture_dir, "request_*.json")))
          print("claude_code_captured_request_count=" + str(len(requests)))
          for position, path in enumerate(requests, 1):
              try:
                  data = json.load(open(path, encoding="utf-8"))
              except Exception:
                  print(f"claude_code_request_{position}_json=invalid")
                  continue
              print(f"claude_code_request_{position}_keys=" + ",".join(sorted(data)))
              status_path = os.path.join(capture_dir, f"response_{position}.status")
              status = open(status_path, encoding="utf-8").read().strip() if os.path.exists(status_path) else "missing"
              print(f"claude_code_request_{position}_response_status={status}")
              messages = data.get("messages")
              if not isinstance(messages, list):
                  messages = []
              print(f"claude_code_request_{position}_message_roles=" + ",".join(str(m.get("role", "unknown")) for m in messages if isinstance(m, dict)))
              block_types = []
              tool_result_shapes = []
              tool_use_shapes = []
              for message in messages:
                  if not isinstance(message, dict):
                      continue
                  content = message.get("content")
                  if not isinstance(content, list):
                      continue
                  for block in content:
                      if not isinstance(block, dict):
                          continue
                      block_type = str(block.get("type", "unknown"))
                      block_types.append(block_type)
                      if block_type == "tool_result":
                          nested = block.get("content")
                          nested_types = []
                          if isinstance(nested, list):
                              nested_types = [str(item.get("type", "unknown")) for item in nested if isinstance(item, dict)]
                          content_text = nested if isinstance(nested, str) else ""
                          lowered = content_text.lower()
                          error_classes = []
                          for needle, label in [
                              ("command not found", "command-not-found"),
                              ("not found", "not-found"),
                              ("permission denied", "permission"),
                              ("operation not permitted", "sandbox"),
                              ("exit code", "exit-code"),
                              ("timed out", "timeout"),
                              ("timeout", "timeout"),
                              ("openssl", "openssl"),
                              ("working directory", "working-directory"),
                              ("no such file", "no-such-file"),
                          ]:
                              if needle in lowered and label not in error_classes:
                                  error_classes.append(label)
                          tool_result_shapes.append(
                              "keys=" + "+".join(sorted(block))
                              + ";is_error=" + str(bool(block.get("is_error"))).lower()
                              + ";content_kind=" + type(nested).__name__
                              + ";content_bytes=" + str(len(content_text.encode("utf-8")))
                              + ";error_classes=" + ("+".join(error_classes) if error_classes else "other")
                              + ";nested_types=" + ("+".join(nested_types) if nested_types else "none")
                          )
                      elif block_type == "tool_use":
                          tool_input = block.get("input")
                          tool_use_shapes.append(
                              "keys=" + "+".join(sorted(block))
                              + ";name=" + str(block.get("name", "unknown"))
                              + ";input_keys=" + ("+".join(sorted(tool_input)) if isinstance(tool_input, dict) else "none")
                          )
              print(f"claude_code_request_{position}_content_block_types=" + (",".join(block_types) if block_types else "none"))
              print(f"claude_code_request_{position}_tool_result_shapes=" + ("|".join(tool_result_shapes) if tool_result_shapes else "none"))
              print(f"claude_code_request_{position}_tool_use_shapes=" + ("|".join(tool_use_shapes) if tool_use_shapes else "none"))
              tools = data.get("tools")
              if not isinstance(tools, list):
                  tools = []
              print(f"claude_code_request_{position}_tool_names=" + ",".join(str(tool.get("name", "unknown")) for tool in tools if isinstance(tool, dict)))
          PY
            python3 - "$claude_output" "$claude_stderr" <<'PY'
          import json
          import os
          import re
          import sys

          output_path, stderr_path = sys.argv[1:]

          def classify(text):
              text = text.lower()
              labels = []
              for needle, label in [
                  ("permission", "permission"), ("denied", "permission"),
                  ("invalid_request", "invalid-request"), ("invalid request", "invalid-request"),
                  ("cache_control", "cache-control"), ("metadata", "metadata"),
                  ("tool_result", "tool-result"), ("tool result", "tool-result"),
                  ("tool_use", "tool-use"), ("tool use", "tool-use"),
                  ("rate limit", "rate-limit"), ("rate_limit", "rate-limit"),
                  ("overloaded", "overloaded"), ("server error", "server-error"),
                  ("api error", "api-error"), ("authentication", "auth"),
                  ("unauthorized", "auth"), ("model", "model"),
                  ("connection", "connection"), ("timeout", "timeout"),
                  ("max turns", "max-turns"), ("max_turns", "max-turns"),
              ]:
                  if needle in text and label not in labels:
                      labels.append(label)
              return labels

          events = []
          if os.path.getsize(output_path):
              for raw in open(output_path, encoding="utf-8", errors="replace"):
                  raw = raw.strip()
                  if not raw:
                      continue
                  try:
                      value = json.loads(raw)
                  except Exception:
                      continue
                  if isinstance(value, dict):
                      events.append(value)
          print("claude_code_event_count=" + str(len(events)))
          print("claude_code_event_types=" + ",".join(sorted({str(e.get("type", "unknown")) for e in events})))

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          expected = "echo $AGENTINTERPOSER_TOOL_PROOF"
          bash_commands = []
          for event in events:
              for obj in walk(event):
                  if obj.get("type") != "tool_use" or obj.get("name") != "Bash":
                      continue
                  tool_input = obj.get("input")
                  if isinstance(tool_input, dict) and isinstance(tool_input.get("command"), str):
                      bash_commands.append(tool_input["command"])
          print("claude_code_bash_tool_use_count=" + str(len(bash_commands)))
          if bash_commands:
              command = bash_commands[0]
              trimmed = command.strip()
              print("claude_code_bash_command_length=" + str(len(command)))
              print("claude_code_bash_command_exact=" + str(command == expected).lower())
              print("claude_code_bash_command_trimmed_exact=" + str(trimmed == expected).lower())
              print("claude_code_bash_command_starts_expected=" + str(trimmed.startswith(expected)).lower())
              print("claude_code_bash_command_matches_proof_env=" + str(command.strip() == "echo $AGENTINTERPOSER_TOOL_PROOF").lower())
              print("claude_code_bash_command_has_newline=" + str("\n" in command or "\r" in command).lower())
              print("claude_code_bash_command_has_pipe=" + str("|" in command).lower())
              print("claude_code_bash_command_has_redirect=" + str(">" in command or "<" in command).lower())
              print("claude_code_bash_command_has_single_quote=" + str("'" in command).lower())
              print("claude_code_bash_command_has_double_quote=" + str('"' in command).lower())
              first_word = trimmed.split(None, 1)[0] if trimmed else "none"
              if not re.fullmatch(r"[A-Za-z0-9_./:-]{1,80}", first_word):
                  first_word = "other"
              print("claude_code_bash_command_first_word=" + first_word)
              try:
                  import shlex
                  tokens = shlex.split(trimmed)
              except Exception:
                  tokens = []
              print("claude_code_bash_command_token_count=" + str(len(tokens)))
              print("claude_code_bash_command_semantic_exact=" + str(tokens == ["echo", "$AGENTINTERPOSER_TOOL_PROOF"]).lower())

          permission_events = [
              event for event in events
              if event.get("type") == "system" and event.get("subtype") == "permission_denied"
          ]
          print("claude_code_permission_denied_event_count=" + str(len(permission_events)))
          if permission_events:
              reason_type = permission_events[-1].get("decision_reason_type")
              if not isinstance(reason_type, str) or not re.fullmatch(r"[A-Za-z0-9_.:-]{1,80}", reason_type):
                  reason_type = "unknown"
              print("claude_code_permission_decision_reason_type=" + reason_type)
              reason = " ".join(
                  str(permission_events[-1].get(key, ""))
                  for key in ("decision_reason", "message")
              ).lower()
              reason_labels = []
              for needle, label in [
                  ("rule", "rule"), ("mode", "mode"), ("deny", "deny"),
                  ("ask", "ask"), ("outside", "outside-path"),
                  ("sandbox", "sandbox"), ("permission", "permission"),
              ]:
                  if needle in reason and label not in reason_labels:
                      reason_labels.append(label)
              print("claude_code_permission_reason_classes=" + (",".join(reason_labels) if reason_labels else "other"))

          result = next((e for e in reversed(events) if e.get("type") == "result"), None)
          if result is not None:
              print("claude_code_subtype=" + str(result.get("subtype", "unknown")))
              print("claude_code_is_error=" + str(bool(result.get("is_error"))).lower())
              print("claude_code_num_turns=" + str(result.get("num_turns", "unknown")))
              print("claude_code_api_error_status=" + str(result.get("api_error_status", "none")))
              print("claude_code_terminal_reason=" + str(result.get("terminal_reason", "none")))
              denials = result.get("permission_denials")
              if not isinstance(denials, list):
                  denials = []
              print("claude_code_permission_denials_count=" + str(len(denials)))
              tool_names = []
              for denial in denials:
                  if not isinstance(denial, dict):
                      continue
                  name = denial.get("tool_name") or denial.get("name")
                  if isinstance(name, str) and re.fullmatch(r"[A-Za-z0-9_.:-]{1,80}", name) and name not in tool_names:
                      tool_names.append(name)
              print("claude_code_permission_denied_tools=" + (",".join(tool_names) if tool_names else "none"))
              error_text = " ".join(str(item) for item in result.get("errors", []) if isinstance(item, str))
              result_text = result.get("result") if isinstance(result.get("result"), str) else ""
              classes = classify(error_text + " " + result_text)
              print("claude_code_output_error_classes=" + (",".join(classes) if classes else "other"))
          if os.path.getsize(stderr_path):
              text = open(stderr_path, encoding="utf-8", errors="replace").read()
              classes = classify(text)
              print("claude_code_stderr_classes=" + (",".join(classes) if classes else "other"))
          PY
            exit 1
          fi

          python3 - "$claude_output" "$proof_expected" <<'PY'
          import json
          import re
          import sys

          output_path, proof_path = sys.argv[1:]
          expected_proof = open(proof_path, encoding="utf-8").read().strip()
          events = []
          for raw in open(output_path, encoding="utf-8", errors="strict"):
              raw = raw.strip()
              if not raw:
                  continue
              value = json.loads(raw)
              if isinstance(value, dict):
                  events.append(value)

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          command = "echo $AGENTINTERPOSER_TOOL_PROOF"
          tool_uses = []
          tool_results = []
          for event in events:
              for obj in walk(event):
                  if obj.get("type") == "tool_use" and obj.get("name") == "Bash":
                      tool_uses.append(obj)
                  elif obj.get("type") == "tool_result":
                      tool_results.append(obj)

          matching_uses = [
              obj for obj in tool_uses
              if isinstance(obj.get("input"), dict) and obj["input"].get("command") == command
          ]
          if len(matching_uses) != 1:
              raise SystemExit("Claude Code did not emit exactly one approved Bash tool_use")
          tool_use_id = matching_uses[0].get("id")
          if not isinstance(tool_use_id, str) or not tool_use_id:
              raise SystemExit("Claude Code Bash tool_use has no id")

          matching_results = [obj for obj in tool_results if obj.get("tool_use_id") == tool_use_id]
          if len(matching_results) != 1:
              raise SystemExit("Claude Code did not emit exactly one matching tool_result")
          if matching_results[0].get("is_error") is True:
              raise SystemExit("Claude Code Bash tool_result reported an error")

          def text_content(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, list):
                  parts = []
                  for block in value:
                      if isinstance(block, dict) and block.get("type") == "text" and isinstance(block.get("text"), str):
                          parts.append(block["text"])
                  return "\n".join(parts)
              return ""

          tool_text = text_content(matching_results[0].get("content"))
          proof = tool_text.strip()
          if not re.fullmatch(r"[0-9a-f]{32}", proof, re.I) or proof != expected_proof:
              raise SystemExit("Claude Code Bash tool_result did not preserve the hidden proof")

          result = next((event for event in reversed(events) if event.get("type") == "result"), None)
          if result is None or result.get("subtype") != "success" or result.get("is_error"):
              raise SystemExit("Claude Code did not finish with a successful result event")
          turns = result.get("num_turns")
          if not isinstance(turns, int) or turns < 2 or turns > 3:
              raise SystemExit("Claude Code completed with an unexpected turn count")
          final_text = result.get("result")
          if not isinstance(final_text, str) or final_text.strip() != proof:
              raise SystemExit("Claude Code final response did not preserve the Bash tool_result proof")

          print("claude_code_bash_tool=ok")
          print("claude_code_tool_result_round_trip=ok")
          print("claude_code_messages_streaming=ok")
          PY
          echo 'claude_code_verified=true' >> "$GITHUB_OUTPUT"

      - name: Probe Codex Responses tool round trip
        if: ${{ inputs.scope == 'codex' }}
        id: codex
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if [ "$MODEL" != 'nvidia/nemotron-3-super-120b-a12b' ]; then
            echo 'Codex certification is currently defined only for nvidia/nemotron-3-super-120b-a12b.' >&2
            exit 2
          fi
          codex_user='agentinterposer-codex'
          codex_root="/tmp/agentinterposer-codex-cli-${GITHUB_RUN_ID}"
          codex_home="/tmp/agentinterposer-codex-home-${GITHUB_RUN_ID}"
          codex_run_dir="/tmp/agentinterposer-codex-run-${GITHUB_RUN_ID}"
          binary="$RUNNER_TEMP/agentinterposer-codex"
          gateway_log="$RUNNER_TEMP/agentinterposer-codex.log"
          codex_jsonl="$codex_run_dir/codex-events.jsonl"
          codex_stderr="$codex_run_dir/codex-stderr.log"
          final_message="$codex_run_dir/codex-final.txt"
          model_catalog="$codex_home/codex-model-catalog.json"
          pid=''
          codex_user_created=false
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          cleanup() {
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            if [ "$codex_user_created" = true ]; then
              sudo userdel "$codex_user" 2>/dev/null || true
            fi
            sudo rm -rf "$codex_root" "$codex_home" "$codex_run_dir"
          }
          trap cleanup EXIT

          if id "$codex_user" >/dev/null 2>&1; then
            echo 'Dedicated Codex certification user unexpectedly already exists.' >&2
            exit 1
          fi
          sudo useradd --system --home-dir "$codex_home" --shell /bin/bash "$codex_user"
          codex_user_created=true
          sudo install -d -m 0700 -o "$codex_user" -g "$codex_user" "$codex_home"
          sudo install -d -m 0770 -o "$codex_user" -g "$runner_gid" "$codex_run_dir"
          mkdir -p "$codex_root"
          npm install --prefix "$codex_root" --no-audit --no-fund --silent '@openai/codex@0.147.0'
          chmod -R a+rX "$codex_root"
          codex="$codex_root/node_modules/.bin/codex"
          codex_version="$($codex --version)"
          if [ "$codex_version" != 'codex-cli 0.147.0' ]; then
            echo "Unexpected Codex version: $codex_version" >&2
            exit 1
          fi

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$gateway_log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Codex probe.' >&2
            exit 1
          fi

          sudo -u "$codex_user" -- env -i PATH='/usr/bin:/bin' \
            python3 - "$codex_home/config.toml" "$model_catalog" "$MODEL" <<'PY'
          import json
          import sys

          config_path, catalog_path, model = sys.argv[1], sys.argv[2], sys.argv[3]
          catalog = {
              "models": [
                  {
                      "slug": model,
                      "display_name": "NVIDIA Nemotron 3 Super",
                      "description": "NVIDIA hosted tool-use model",
                      "default_reasoning_level": None,
                      "supported_reasoning_levels": [],
                      "shell_type": "shell_command",
                      "visibility": "none",
                      "minimal_client_version": [0, 147, 0],
                      "supported_in_api": True,
                      "priority": 99,
                      "upgrade": None,
                      "model_messages": {
                          "instructions_template": "You are a coding agent. Use available tools when needed and follow the user request.",
                          "instructions_variables": None,
                          "approvals": None,
                          "collaboration_modes": None,
                          "auto_review": None,
                          "permissions": None,
                      },
                      "include_skills_usage_instructions": False,
                      "include_plugin_usage_instructions": False,
                      "include_apps_usage_instructions": False,
                      "supports_reasoning_summary_parameter": False,
                      "default_reasoning_summary": "none",
                      "support_verbosity": False,
                      "default_verbosity": None,
                      "apply_patch_tool_type": None,
                      "web_search_tool_type": "text",
                      "truncation_policy": {"mode": "bytes", "limit": 10000},
                      "supports_parallel_tool_calls": False,
                      "supports_image_detail_original": False,
                      "context_window": 1000000,
                      "max_context_window": 1000000,
                      "effective_context_window_percent": 95,
                      "experimental_supported_tools": [],
                      "input_modalities": ["text"],
                      "supports_search_tool": False,
                      "use_responses_lite": False,
                  }
              ]
          }
          with open(catalog_path, "w", encoding="utf-8") as handle:
              json.dump(catalog, handle, separators=(",", ":"))

          with open(config_path, "w", encoding="utf-8") as handle:
              handle.write(f"model = {json.dumps(model)}\n")
              handle.write('model_provider = "agentinterposer"\n')
              handle.write('approval_policy = "never"\n')
              handle.write('sandbox_mode = "read-only"\n')
              handle.write('web_search = "disabled"\n')
              handle.write('model_reasoning_summary = "none"\n')
              handle.write(f"model_catalog_json = {json.dumps(catalog_path)}\n\n")
              handle.write('[agents]\n')
              handle.write('enabled = false\n\n')
              handle.write('[features]\n')
              handle.write('view_image = false\n')
              handle.write('unified_exec = false\n\n')
              handle.write('[tools.experimental_request_user_input]\n')
              handle.write('enabled = false\n\n')
              handle.write('[tools.update_plan]\n')
              handle.write('enabled = false\n\n')
              handle.write('[model_providers.agentinterposer]\n')
              handle.write('name = "AgentInterposer certification"\n')
              handle.write('base_url = "http://127.0.0.1:11435/v1"\n')
              handle.write('env_key = "AGENTINTERPOSER_CLIENT_KEY"\n')
              handle.write('wire_api = "responses"\n')
              handle.write('request_max_retries = 0\n')
              handle.write('stream_max_retries = 0\n')
          PY

          runner_shell_pid=$$
          codex_uid="$(id -u "$codex_user")"
          if [ "$runner_uid" = "$codex_uid" ]; then
            echo 'Codex certification user is not UID-isolated from the runner.' >&2
            exit 1
          fi
          for protected_pid in "$runner_shell_pid" "$pid"; do
            if sudo -u "$codex_user" -- bash -c "exec 3<\"/proc/\$1/environ\"" bash "$protected_pid" 2>/dev/null; then
              echo 'Codex certification user can read a protected runner process environment.' >&2
              exit 1
            fi
          done

          node_bin_dir="$(dirname "$(command -v node)")"
          codex_env_names="$(sudo -u "$codex_user" -- env -i \
            HOME="$codex_home" \
            PATH="$node_bin_dir:/usr/local/bin:/usr/bin:/bin" \
            CODEX_HOME="$codex_home" \
            AGENTINTERPOSER_CLIENT_KEY='local-client-placeholder' \
            env | cut -d= -f1 | sort)"
          for forbidden_name in NVIDIA_API_KEY DOPPLER_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN; do
            if grep -qx "$forbidden_name" <<<"$codex_env_names"; then
              echo "Forbidden credential environment name reached Codex: $forbidden_name" >&2
              exit 1
            fi
          done
          echo 'codex_os_user_isolation=ok'
          echo 'codex_secret_environment_isolation=ok'
          if sudo -u "$codex_user" -- sudo -n true >/dev/null 2>&1; then
            echo 'Codex certification user unexpectedly has passwordless sudo.' >&2
            exit 1
          fi
          echo 'codex_privilege_escalation_blocked=ok'
          if sudo -u "$codex_user" -- git -C "$GITHUB_WORKSPACE" config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo 'Checkout persisted a Git authorization header visible to Codex.' >&2
            exit 1
          fi
          echo 'codex_git_credentials_not_persisted=ok'

          isolated_version="$(sudo -u "$codex_user" -- env -i \
            HOME="$codex_home" \
            PATH="$node_bin_dir:/usr/local/bin:/usr/bin:/bin" \
            CODEX_HOME="$codex_home" \
            AGENTINTERPOSER_CLIENT_KEY='local-client-placeholder' \
            "$codex" --version)"
          if [ "$isolated_version" != 'codex-cli 0.147.0' ]; then
            echo 'Codex launcher failed under the isolated certification user.' >&2
            exit 1
          fi
          echo 'codex_isolated_launcher=ok'

          prompt='Run exactly one shell command. The executable must be cat and its only argument must be /proc/sys/kernel/random/uuid. Do not add another argument and do not run another command. Then reply with exactly the command stdout and nothing else. Do not guess or infer the value.'
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            sudo -u "$codex_user" -- bash -c "cd \"\$1\" && shift && exec env -i \"\$@\"" bash "$codex_run_dir" \
              HOME="$codex_home" \
              PATH="$node_bin_dir:/usr/local/bin:/usr/bin:/bin" \
              CODEX_HOME="$codex_home" \
              AGENTINTERPOSER_CLIENT_KEY='local-client-placeholder' \
              "$codex" exec \
                --ephemeral \
                --skip-git-repo-check \
                --sandbox danger-full-access \
                --ignore-rules \
                --json \
                --output-last-message "$final_message" \
                "$prompt" >"$codex_jsonl" 2>"$codex_stderr"
          codex_status=$?
          set -e
          sudo chown -R "$runner_uid:$runner_gid" "$codex_run_dir"

          echo "codex_cli_version=$codex_version"
          echo "codex_exit=$codex_status"
          if [ "$codex_status" -ne 0 ]; then
            echo 'Codex Responses tool round trip did not complete.' >&2
          fi

          set +e
          python3 - "$codex_jsonl" "$final_message" <<'PY'
          import json
          import re
          import sys

          jsonl_path, final_path = sys.argv[1:]
          counts = {}
          item_counts = {}
          command_results = []
          successful_outputs = []
          try:
              lines = open(jsonl_path, encoding="utf-8")
          except OSError:
              lines = []
          for raw in lines:
              try:
                  event = json.loads(raw)
              except Exception:
                  continue
              event_type = str(event.get("type") or "unknown")
              counts[event_type] = counts.get(event_type, 0) + 1
              item = event.get("item")
              if not isinstance(item, dict):
                  continue
              item_type = str(item.get("type") or "unknown")
              item_counts[item_type] = item_counts.get(item_type, 0) + 1
              if event_type != "item.completed" or item_type != "command_execution":
                  continue
              status = str(item.get("status") or "unknown")
              exit_code = item.get("exit_code")
              output = item.get("aggregated_output")
              output_bytes = len(output.encode("utf-8")) if isinstance(output, str) else 0
              command_results.append((status, exit_code, output_bytes))
              if status == "completed" and exit_code == 0 and isinstance(output, str):
                  successful_outputs.append(output)

          print("codex_event_types=" + ",".join(f"{key}:{counts[key]}" for key in sorted(counts)))
          print("codex_item_types=" + ",".join(f"{key}:{item_counts[key]}" for key in sorted(item_counts)))
          for index, (status, exit_code, output_bytes) in enumerate(command_results, start=1):
              print(f"codex_command_result_{index}=status:{status},exit:{exit_code},output_bytes:{output_bytes}")
          print("codex_completed_command_count=" + str(len(command_results)))

          if len(command_results) != 1 or len(successful_outputs) != 1:
              raise SystemExit("Codex did not complete exactly one successful shell command")

          uuid_pattern = re.compile(r"\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b", re.IGNORECASE)
          match = uuid_pattern.search(successful_outputs[0])
          tool_uuid = match.group(0) if match else None
          print("codex_tool_output_uuid=" + str(tool_uuid is not None).lower())
          if tool_uuid is None:
              raise SystemExit("Successful shell command output contained no UUID proof")

          try:
              final = open(final_path, encoding="utf-8").read()
          except OSError:
              raise SystemExit("Codex produced no final response file")
          contains = tool_uuid in final
          print("codex_final_bytes=" + str(len(final.encode("utf-8"))))
          print("codex_final_contains_tool_uuid=" + str(contains).lower())
          if not contains:
              raise SystemExit("Codex final response did not contain the shell command UUID proof")
          PY
          proof_check_status=$?
          set -e

          if [ "$codex_status" -ne 0 ]; then
            exit "$codex_status"
          fi
          if [ "$proof_check_status" -ne 0 ]; then
            exit "$proof_check_status"
          fi

          echo 'codex_responses_streaming=ok'
          echo 'codex_function_call_round_trip=ok'
          echo 'codex_verified=true' >> "$GITHUB_OUTPUT"

      - name: Write compatibility summary
        if: ${{ always() }}
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          SCOPE: ${{ inputs.scope }}
          CHAT_OUTCOME: ${{ steps.chat.outcome }}
          RESPONSES_SUPPORTED: ${{ steps.responses.outputs.responses_supported }}
          MESSAGES_SUPPORTED: ${{ steps.messages.outputs.messages_supported }}
          GATEWAY_OUTCOME: ${{ steps.gateway.outcome }}
          MESSAGES_GATEWAY_OUTCOME: ${{ steps.messages_gateway.outcome }}
          MESSAGES_ADAPTER_VERIFIED: ${{ steps.messages_gateway.outputs.messages_adapter_verified }}
          MESSAGES_STREAM_OUTCOME: ${{ steps.messages_stream_gateway.outcome }}
          MESSAGES_STREAM_VERIFIED: ${{ steps.messages_stream_gateway.outputs.messages_stream_verified }}
          CLAUDE_CODE_OUTCOME: ${{ steps.claude_code.outcome }}
          CLAUDE_CODE_VERIFIED: ${{ steps.claude_code.outputs.claude_code_verified }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          CODEX_VERIFIED: ${{ steps.codex.outputs.codex_verified }}
        run: |
          {
            echo '## NVIDIA hosted compatibility probe'
            echo
            echo "- Model: \`${MODEL}\`"
            echo "- Scope: ${SCOPE}"
            if [ "$SCOPE" = 'codex' ]; then
              echo "- Codex CLI 0.147.0 step: ${CODEX_OUTCOME:-not-run}"
              echo "- Codex Responses tool round trip: ${CODEX_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'claude-code' ]; then
              echo "- Claude Code CLI 2.1.226 step: ${CLAUDE_CODE_OUTCOME:-not-run}"
              echo "- Claude Code Messages tool round trip: ${CLAUDE_CODE_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'baseline' ]; then
              echo "- Chat Completions baseline: ${CHAT_OUTCOME:-not-run}"
            elif [ "$SCOPE" = 'messages' ]; then
              echo "- AgentInterposer Messages adapter step: ${MESSAGES_GATEWAY_OUTCOME:-not-run}"
              echo "- Messages text + tool round trip: ${MESSAGES_ADAPTER_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'messages-stream' ]; then
              echo "- AgentInterposer Messages streaming step: ${MESSAGES_STREAM_OUTCOME:-not-run}"
              echo "- Messages text + tool SSE: ${MESSAGES_STREAM_VERIFIED:-not-verified}"
            else
              echo "- Chat Completions step: ${CHAT_OUTCOME:-not-run}"
              echo "- Responses API: ${RESPONSES_SUPPORTED:-unknown}"
              echo "- Anthropic Messages API: ${MESSAGES_SUPPORTED:-unknown}"
              echo "- AgentInterposer Responses passthrough step: ${GATEWAY_OUTCOME:-not-run}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
