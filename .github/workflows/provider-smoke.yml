          fi
          echo 'claude_code_version=2.1.226'
          echo "claude_bin=$claude_bin" >> "$GITHUB_OUTPUT"

      - name: Probe Claude Code Messages tool round trip
        if: ${{ inputs.scope == 'claude-code' || inputs.scope == 'claude-code-error' || inputs.scope == 'claude-code-loop' }}
        id: claude_code
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
          SCOPE: ${{ inputs.scope }}
          CLAUDE_BIN: ${{ steps.claude_install.outputs.claude_bin }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer-claude-code"
          gateway_log="$RUNNER_TEMP/agentinterposer-claude-code.log"
          claude_output="$RUNNER_TEMP/claude-code-output.json"
          claude_stderr="$RUNNER_TEMP/claude-code-stderr.log"
          proof_expected="$RUNNER_TEMP/claude-code-proof-expected"
          claude_user='agentinterposer-claude'
          claude_home='/tmp/agentinterposer-claude-home'
          claude_settings="$claude_home/settings.json"
          pid=''

          cleanup() {
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            if id "$claude_user" >/dev/null 2>&1; then
              sudo userdel -r "$claude_user" >/dev/null 2>&1 || true
            fi
            sudo rm -rf "$claude_home"
            rm -f "$binary" "$gateway_log" "$claude_output" "$claude_stderr" "$proof_expected"
          }
          trap cleanup EXIT

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$gateway_log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Claude Code probe.' >&2
            exit 1
          fi

          if id "$claude_user" >/dev/null 2>&1; then
            echo 'Dedicated Claude Code certification user unexpectedly already exists.' >&2
            exit 1
          fi
          sudo useradd --create-home --home-dir "$claude_home" --shell /bin/bash "$claude_user"
          sudo install -d -o "$claude_user" -g "$claude_user" -m 0755 "$claude_home/.claude" "$claude_home/work"
          if [ "$SCOPE" = 'claude-code-error' ]; then
            printf '%s\n' '{"permissions":{"allow":["Bash(false)","Bash(echo $AGENTINTERPOSER_TOOL_PROOF)"]}}' > "$RUNNER_TEMP/claude-code-settings.json"
          elif [ "$SCOPE" = 'claude-code-loop' ]; then
            printf '%s\n' '{"permissions":{"allow":["Bash(echo $AGENTINTERPOSER_TOOL_PROOF)","Bash(printf *)","Bash(sha256sum)"]}}' > "$RUNNER_TEMP/claude-code-settings.json"
          else
            printf '%s\n' '{"permissions":{"allow":["Bash(echo $AGENTINTERPOSER_TOOL_PROOF)"]}}' > "$RUNNER_TEMP/claude-code-settings.json"
          fi
          sudo install -o "$claude_user" -g "$claude_user" -m 0600 "$RUNNER_TEMP/claude-code-settings.json" "$claude_settings"
          rm -f "$RUNNER_TEMP/claude-code-settings.json"

          shell_pid=$$
          if sudo -u "$claude_user" sh -c "cat /proc/$shell_pid/environ >/dev/null 2>&1"; then
            echo 'Claude Code isolation failed: runner environment is readable.' >&2
            exit 1
          fi
          if sudo -u "$claude_user" sh -c "cat /proc/$pid/environ >/dev/null 2>&1"; then
            echo 'Claude Code isolation failed: gateway environment is readable.' >&2
            exit 1
          fi
          if sudo -u "$claude_user" sudo -n true >/dev/null 2>&1; then
            echo 'Claude Code isolation failed: certification user has sudo access.' >&2
            exit 1
          fi
          if ! sudo -u "$claude_user" test -x "$CLAUDE_BIN"; then
            echo 'Claude Code binary is not executable by the certification user.' >&2
            exit 1
          fi
          if ! sudo -u "$claude_user" sh -c 'cd "$1" && test "$PWD" = "$1"' sh "$claude_home/work"; then
            echo 'Claude Code certification workdir is not accessible to the probe user.' >&2
            exit 1
          fi
          echo 'claude_code_os_user_isolation=ok'
          echo 'claude_code_secret_environment_isolation=ok'
          echo 'claude_code_workdir_access=ok'

          python3 - "$proof_expected" <<'PY'
          import secrets
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(secrets.token_hex(16) + "\n")
          PY
          chmod 0600 "$proof_expected"
          proof="$(cat "$proof_expected")"

          max_turns=3
          if [ "$SCOPE" = 'claude-code-error' ]; then
            max_turns=5
            prompt=$'Use Bash exactly twice and in this exact order. First run the exact command `false`; it must fail. After you receive that failed tool result, recover by running exactly `echo $AGENTINTERPOSER_TOOL_PROOF`. The hidden proof is not present in this prompt. After the second command completes, reply with exactly its stdout and no other text.'
          elif [ "$SCOPE" = 'claude-code-loop' ]; then
            max_turns=5
            prompt=$'Use Bash exactly twice, sequentially. First run exactly `echo $AGENTINTERPOSER_TOOL_PROOF`. The hidden proof is not present in this prompt. After you receive the first tool result, strip its trailing newline and call Bash a second time with exactly `printf %s PROOF_VALUE | sha256sum`, replacing PROOF_VALUE with the literal 32-character proof from the first tool result. Do not use the environment variable in the second command and do not run any other command. After the second command completes, reply with exactly the 64-character SHA-256 digest from its stdout and no other text.'
          else
            prompt=$'Use Bash exactly once to read the hidden certification value from the process environment. The value is not present in this prompt and your answer is invalid unless the Bash tool is called. The command string must be exactly the text between BEGIN_COMMAND and END_COMMAND.\nBEGIN_COMMAND\necho $AGENTINTERPOSER_TOOL_PROOF\nEND_COMMAND\nAfter the command completes, reply with exactly stdout and no other text.'
          fi
          set +e
          sudo -u "$claude_user" env -i \
            HOME="$claude_home" \
            PATH='/usr/local/bin:/usr/bin:/bin' \
            AGENTINTERPOSER_TOOL_PROOF="$proof" \
            CLAUDE_CONFIG_DIR="$claude_home/.claude" \
            ANTHROPIC_BASE_URL='http://127.0.0.1:11435' \
            ANTHROPIC_AUTH_TOKEN='agentinterposer-local-placeholder' \
            ANTHROPIC_MODEL="$MODEL" \
            CLAUDE_CODE_DISABLE_THINKING='1' \
            CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS='1' \
            CLAUDE_CODE_EFFORT_LEVEL='auto' \
            CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC='1' \
            CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK='1' \
            NO_PROXY='127.0.0.1,localhost' \
            bash -c 'cd "$1" && shift && exec "$@"' bash "$claude_home/work" \
            timeout 180s "$CLAUDE_BIN" \
              -p "$prompt" \
              --bare \
              --no-session-persistence \
              --tools 'Bash' \
              --permission-mode default \
              --settings "$claude_settings" \
              --max-turns "$max_turns" \
              --output-format stream-json \
              --verbose \
              >"$claude_output" 2>"$claude_stderr"
          claude_exit=$?
          set -e
          echo "claude_code_exit=${claude_exit}"

          python3 - "$claude_output" "$claude_stderr" "$proof_expected" "$claude_exit" "$SCOPE" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          output_path, stderr_path, proof_path, exit_text, scope = sys.argv[1:]
          exit_code = int(exit_text)
          expected_proof = open(proof_path, encoding="utf-8").read().strip()
          events = []
          if os.path.exists(output_path):
              for raw in open(output_path, encoding="utf-8", errors="replace"):
                  raw = raw.strip()
                  if not raw:
                      continue
                  try:
                      value = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value, dict):
                      events.append(value)

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          result = next((event for event in reversed(events) if event.get("type") == "result"), None)
          if exit_code != 0:
              print("claude_code_failure_event_count=" + str(len(events)))
              if isinstance(result, dict):
                  denials = result.get("permission_denials")
                  if not isinstance(denials, list):
                      denials = []
                  print("claude_code_failure_permission_denials=" + str(len(denials)))
                  status = result.get("api_error_status")
                  if isinstance(status, int):
                      print("claude_code_failure_api_status=" + str(status))
              if os.path.exists(stderr_path) and os.path.getsize(stderr_path):
                  text = open(stderr_path, encoding="utf-8", errors="replace").read().lower()
                  labels = []
                  for needle, label in [
                      ("permission", "permission"),
                      ("api error", "api-error"),
                      ("timeout", "timeout"),
                      ("connection", "connection"),
                      ("model", "model"),
                  ]:
                      if needle in text and label not in labels:
                          labels.append(label)
                  print("claude_code_failure_stderr_classes=" + (",".join(labels) if labels else "other"))
              raise SystemExit("Claude Code certification client failed")

          success_command = "echo $AGENTINTERPOSER_TOOL_PROOF"
          error_command = "false"
          tool_uses = []
          tool_results = []
          for event in events:
              for obj in walk(event):
                  if obj.get("type") == "tool_use" and obj.get("name") == "Bash":
                      tool_uses.append(obj)
                  elif obj.get("type") == "tool_result":
                      tool_results.append(obj)

          def matching_use(command):
              return [
                  obj for obj in tool_uses
                  if isinstance(obj.get("input"), dict) and obj["input"].get("command") == command
              ]

          def result_for(tool_use):
              tool_use_id = tool_use.get("id")
              if not isinstance(tool_use_id, str) or not tool_use_id:
                  raise SystemExit("Claude Code Bash tool_use has no id")
              matches = [obj for obj in tool_results if obj.get("tool_use_id") == tool_use_id]
              if len(matches) != 1:
                  raise SystemExit("Claude Code did not emit exactly one matching tool_result")
              return matches[0]

          def text_content(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, list):
                  return "\n".join(
                      block["text"]
                      for block in value
                      if isinstance(block, dict)
                      and block.get("type") == "text"
                      and isinstance(block.get("text"), str)
                  )
              return ""

          success_uses = matching_use(success_command)
          if len(success_uses) != 1:
              raise SystemExit("Claude Code did not emit exactly one approved successful Bash tool_use")
          success_result = result_for(success_uses[0])
          if success_result.get("is_error") is True:
              raise SystemExit("Claude Code successful Bash tool_result reported an error")
          proof = text_content(success_result.get("content")).strip()
          if not re.fullmatch(r"[0-9a-f]{32}", proof, re.I) or proof != expected_proof:
              raise SystemExit("Claude Code Bash tool_result did not preserve the hidden proof")

          final_proof = proof
          if scope == "claude-code-error":
              if len(tool_uses) != 2:
                  raise SystemExit("Claude Code error recovery emitted an unexpected Bash tool_use count")
              error_uses = matching_use(error_command)
              if len(error_uses) != 1:
                  raise SystemExit("Claude Code did not emit exactly one intentional failing Bash tool_use")
              error_result = result_for(error_uses[0])
              if error_result.get("is_error") is not True:
                  raise SystemExit("Claude Code failing Bash tool_result did not report is_error=true")
              if not text_content(error_result.get("content")).strip():
                  raise SystemExit("Claude Code failing Bash tool_result had no error content")
              error_id = error_uses[0].get("id")
              success_id = success_uses[0].get("id")
              ordered_ids = [obj.get("id") for obj in tool_uses if obj.get("id") in (error_id, success_id)]
              if ordered_ids != [error_id, success_id]:
                  raise SystemExit("Claude Code did not recover after the failing Bash tool in order")
          elif scope == "claude-code-loop":
              if len(tool_uses) != 2:
                  raise SystemExit("Claude Code dependent loop emitted an unexpected Bash tool_use count")
              second_command = f"printf %s {proof} | sha256sum"
              second_uses = matching_use(second_command)
              if len(second_uses) != 1:
                  raise SystemExit("Claude Code did not derive the exact second Bash command from the first tool result")
              second_result = result_for(second_uses[0])
              if second_result.get("is_error") is True:
                  raise SystemExit("Claude Code dependent second Bash tool_result reported an error")
              second_text = text_content(second_result.get("content")).strip()
              expected_hash = hashlib.sha256(proof.encode("utf-8")).hexdigest()
              hash_match = re.search(r"\b[0-9a-f]{64}\b", second_text, re.I)
              if not hash_match or hash_match.group(0).lower() != expected_hash:
                  raise SystemExit("Claude Code dependent second tool result did not preserve the expected SHA-256 proof")
              success_id = success_uses[0].get("id")
              second_id = second_uses[0].get("id")
              ordered_ids = [obj.get("id") for obj in tool_uses if obj.get("id") in (success_id, second_id)]
              if ordered_ids != [success_id, second_id]:
                  raise SystemExit("Claude Code did not execute the dependent Bash tools in order")
              final_proof = expected_hash
          elif len(tool_uses) != 1:
              raise SystemExit("Claude Code emitted unexpected additional Bash tool_use events")

          if not isinstance(result, dict) or result.get("subtype") != "success" or result.get("is_error"):
              raise SystemExit("Claude Code did not finish with a successful result event")
          denials = result.get("permission_denials")
          if denials not in (None, []):
              raise SystemExit("Claude Code reported a permission denial during certification")
          turns = result.get("num_turns")
          if not isinstance(turns, int):
              raise SystemExit("Claude Code completed without a numeric turn count")
          if scope in {"claude-code-error", "claude-code-loop"}:
              if turns < 3 or turns > 5:
                  raise SystemExit("Claude Code multi-turn certification completed with an unexpected turn count")
          elif turns < 2 or turns > 3:
              raise SystemExit("Claude Code completed with an unexpected turn count")
          final_text = result.get("result")
          if not isinstance(final_text, str) or final_text.strip().lower() != final_proof.lower():
              raise SystemExit("Claude Code final response did not preserve the expected tool-derived proof")

          print("claude_code_bash_tool=ok")
          print("claude_code_tool_result_round_trip=ok")
          if scope == "claude-code-error":
              print("claude_code_error_tool_result=ok")
              print("claude_code_error_recovery=ok")
          elif scope == "claude-code-loop":
              print("claude_code_dependent_two_tool_loop=ok")
          print("claude_code_messages_streaming=ok")
          PY
          if [ "$SCOPE" = 'claude-code-error' ]; then
            echo 'claude_code_error_verified=true' >> "$GITHUB_OUTPUT"
          elif [ "$SCOPE" = 'claude-code-loop' ]; then
            echo 'claude_code_loop_verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'claude_code_verified=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Codex Responses tool round trip
        if: ${{ inputs.scope == 'codex' || inputs.scope == 'codex-loop' || inputs.scope == 'codex-long-loop' }}
        id: codex
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ steps.doppler.outputs.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [ "$MODEL" != 'nvidia/nemotron-3-super-120b-a12b' ]; then
            echo 'Codex certification is currently defined only for nvidia/nemotron-3-super-120b-a12b.' >&2
            exit 2
          fi
          codex_user='agentinterposer-codex'
          codex_root="/tmp/agentinterposer-codex-cli-${GITHUB_RUN_ID}"
          codex_home="/tmp/agentinterposer-codex-home-${GITHUB_RUN_ID}"
          codex_run_dir="/tmp/agentinterposer-codex-run-${GITHUB_RUN_ID}"
          binary="$RUNNER_TEMP/agentinterposer-codex"
          gateway_log="$RUNNER_TEMP/agentinterposer-codex.log"
          codex_jsonl="$codex_run_dir/codex-events.jsonl"
          codex_stderr="$codex_run_dir/codex-stderr.log"
          final_message="$codex_run_dir/codex-final.txt"
          model_catalog="$codex_home/codex-model-catalog.json"
          pid=''
          codex_user_created=false
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          cleanup() {
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            if [ "$codex_user_created" = true ]; then
              sudo userdel "$codex_user" 2>/dev/null || true
            fi
            sudo rm -rf "$codex_root" "$codex_home" "$codex_run_dir"
          }
          trap cleanup EXIT

          if id "$codex_user" >/dev/null 2>&1; then
            echo 'Dedicated Codex certification user unexpectedly already exists.' >&2
            exit 1
          fi
          sudo useradd --system --home-dir "$codex_home" --shell /bin/bash "$codex_user"
          codex_user_created=true
          sudo install -d -m 0700 -o "$codex_user" -g "$codex_user" "$codex_home"
          sudo install -d -m 0770 -o "$codex_user" -g "$runner_gid" "$codex_run_dir"
          mkdir -p "$codex_root"
          npm install --prefix "$codex_root" --no-audit --no-fund --silent '@openai/codex@0.147.0'
          chmod -R a+rX "$codex_root"
          codex="$codex_root/node_modules/.bin/codex"
          codex_version="$($codex --version)"
          if [ "$codex_version" != 'codex-cli 0.147.0' ]; then
            echo "Unexpected Codex version: $codex_version" >&2
            exit 1
          fi

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            "$binary" >"$gateway_log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            echo 'AgentInterposer did not become ready for the Codex probe.' >&2
            exit 1
          fi

          sudo -u "$codex_user" -- env -i PATH='/usr/bin:/bin' \
            python3 - "$codex_home/config.toml" "$model_catalog" "$MODEL" <<'PY'
          import json
          import sys

          config_path, catalog_path, model = sys.argv[1], sys.argv[2], sys.argv[3]
          catalog = {
              "models": [
                  {
                      "slug": model,
                      "display_name": "NVIDIA Nemotron 3 Super",
                      "description": "NVIDIA hosted tool-use model",
                      "default_reasoning_level": None,
                      "supported_reasoning_levels": [],
                      "shell_type": "shell_command",
                      "visibility": "none",
                      "minimal_client_version": [0, 147, 0],
                      "supported_in_api": True,
                      "priority": 99,
                      "upgrade": None,
                      "model_messages": {
                          "instructions_template": "You are a coding agent. Use available tools when needed and follow the user request.",
                          "instructions_variables": None,
                          "approvals": None,
                          "collaboration_modes": None,
                          "auto_review": None,
                          "permissions": None,
                      },
                      "include_skills_usage_instructions": False,
                      "include_plugin_usage_instructions": False,
                      "include_apps_usage_instructions": False,
                      "supports_reasoning_summary_parameter": False,
                      "default_reasoning_summary": "none",
                      "support_verbosity": False,
                      "default_verbosity": None,
                      "apply_patch_tool_type": None,
                      "web_search_tool_type": "text",
                      "truncation_policy": {"mode": "bytes", "limit": 10000},
                      "supports_parallel_tool_calls": False,
                      "supports_image_detail_original": False,
                      "context_window": 1000000,
                      "max_context_window": 1000000,
                      "effective_context_window_percent": 95,
                      "experimental_supported_tools": [],
                      "input_modalities": ["text"],
                      "supports_search_tool": False,
                      "use_responses_lite": False,
                  }
              ]
          }
          with open(catalog_path, "w", encoding="utf-8") as handle:
              json.dump(catalog, handle, separators=(",", ":"))

          with open(config_path, "w", encoding="utf-8") as handle:
              handle.write(f"model = {json.dumps(model)}\n")
              handle.write('model_provider = "agentinterposer"\n')
              handle.write('approval_policy = "never"\n')
              handle.write('sandbox_mode = "read-only"\n')
              handle.write('web_search = "disabled"\n')
              handle.write('model_reasoning_summary = "none"\n')
              handle.write(f"model_catalog_json = {json.dumps(catalog_path)}\n\n")
              handle.write('[agents]\n')
              handle.write('enabled = false\n\n')
              handle.write('[features]\n')
              handle.write('view_image = false\n')
              handle.write('unified_exec = false\n\n')
              handle.write('[tools.experimental_request_user_input]\n')
              handle.write('enabled = false\n\n')
              handle.write('[tools.update_plan]\n')
              handle.write('enabled = false\n\n')
              handle.write('[model_providers.agentinterposer]\n')
              handle.write('name = "AgentInterposer certification"\n')
              handle.write('base_url = "http://127.0.0.1:11435/v1"\n')
              handle.write('env_key = "AGENTINTERPOSER_CLIENT_KEY"\n')
              handle.write('wire_api = "responses"\n')
              handle.write('request_max_retries = 0\n')
              handle.write('stream_max_retries = 0\n')
          PY

          runner_shell_pid=$$
          codex_uid="$(id -u "$codex_user")"
          if [ "$runner_uid" = "$codex_uid" ]; then
            echo 'Codex certification user is not UID-isolated from the runner.' >&2
            exit 1
          fi
          for protected_pid in "$runner_shell_pid" "$pid"; do
            if sudo -u "$codex_user" -- bash -c "exec 3<\"/proc/\$1/environ\"" bash "$protected_pid" 2>/dev/null; then
              echo 'Codex certification user can read a protected runner process environment.' >&2
              exit 1
            fi
          done

          node_bin_dir="$(dirname "$(command -v node)")"
          codex_env_names="$(sudo -u "$codex_user" -- env -i \
            HOME="$codex_home" \
            PATH="$node_bin_dir:/usr/local/bin:/usr/bin:/bin" \
            CODEX_HOME="$codex_home" \
            AGENTINTERPOSER_CLIENT_KEY='local-client-placeholder' \
            env | cut -d= -f1 | sort)"
          for forbidden_name in NVIDIA_API_KEY DOPPLER_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN; do
            if grep -qx "$forbidden_name" <<<"$codex_env_names"; then
              echo "Forbidden credential environment name reached Codex: $forbidden_name" >&2
              exit 1
            fi
          done
          echo 'codex_os_user_isolation=ok'
          echo 'codex_secret_environment_isolation=ok'
          if sudo -u "$codex_user" -- sudo -n true >/dev/null 2>&1; then
            echo 'Codex certification user unexpectedly has passwordless sudo.' >&2
            exit 1
          fi
          echo 'codex_privilege_escalation_blocked=ok'
          if sudo -u "$codex_user" -- git -C "$GITHUB_WORKSPACE" config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo 'Checkout persisted a Git authorization header visible to Codex.' >&2
            exit 1
          fi
          echo 'codex_git_credentials_not_persisted=ok'

          isolated_version="$(sudo -u "$codex_user" -- env -i \
            HOME="$codex_home" \
            PATH="$node_bin_dir:/usr/local/bin:/usr/bin:/bin" \
            CODEX_HOME="$codex_home" \
            AGENTINTERPOSER_CLIENT_KEY='local-client-placeholder' \
            "$codex" --version)"
          if [ "$isolated_version" != 'codex-cli 0.147.0' ]; then
            echo 'Codex launcher failed under the isolated certification user.' >&2
            exit 1
          fi
          echo 'codex_isolated_launcher=ok'

          if [ "$SCOPE" = 'codex-long-loop' ]; then
            prompt='Run exactly three shell commands, sequentially. First run `cat /proc/sys/kernel/random/uuid`. After you receive that stdout, strip its trailing newline and run a second shell command that computes the lowercase SHA-256 hex digest of exactly that UUID value. After you receive the second stdout, strip surrounding whitespace and run a third shell command that computes the lowercase SHA-256 hex digest of exactly the 64-character digest produced by the second command. Each later command must derive its literal input from the immediately previous tool result; do not guess, reuse a cached value, use an environment variable, or skip a tool call. After the third command completes, reply with exactly its 64-character lowercase SHA-256 digest and nothing else.'
          elif [ "$SCOPE" = 'codex-loop' ]; then
            prompt='Run exactly two shell commands, sequentially. First run `cat /proc/sys/kernel/random/uuid`. After you receive that command stdout, strip its trailing newline and run a second shell command that computes the SHA-256 hex digest of exactly that UUID value. The second command must derive its input from the first command result; do not guess, reuse a cached value, or skip either tool call. After the second command completes, reply with exactly the 64-character lowercase SHA-256 digest and nothing else.'
          else
            prompt='Run exactly one shell command. The executable must be cat and its only argument must be /proc/sys/kernel/random/uuid. Do not add another argument and do not run another command. Then reply with exactly the command stdout and nothing else. Do not guess or infer the value.'
          fi
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            sudo -u "$codex_user" -- bash -c "cd \"\$1\" && shift && exec env -i \"\$@\"" bash "$codex_run_dir" \
              HOME="$codex_home" \
              PATH="$node_bin_dir:/usr/local/bin:/usr/bin:/bin" \
              CODEX_HOME="$codex_home" \
              AGENTINTERPOSER_CLIENT_KEY='local-client-placeholder' \
              "$codex" exec \
                --ephemeral \
                --skip-git-repo-check \
                --sandbox danger-full-access \
                --ignore-rules \
                --json \
                --output-last-message "$final_message" \
                "$prompt" >"$codex_jsonl" 2>"$codex_stderr"
          codex_status=$?
          set -e
          sudo chown -R "$runner_uid:$runner_gid" "$codex_run_dir"

          echo "codex_cli_version=$codex_version"
          echo "codex_exit=$codex_status"
          if [ "$codex_status" -ne 0 ]; then
            echo 'Codex Responses tool round trip did not complete.' >&2
          fi

          set +e
          python3 - "$codex_jsonl" "$final_message" "$SCOPE" <<'PY'
          import hashlib
          import json
          import re
          import sys

          jsonl_path, final_path, scope = sys.argv[1:]
          counts = {}
          item_counts = {}
          command_results = []
          successful_outputs = []
          try:
              lines = open(jsonl_path, encoding="utf-8")
          except OSError:
              lines = []
          for raw in lines:
              try:
                  event = json.loads(raw)
              except Exception:
                  continue
              event_type = str(event.get("type") or "unknown")
              counts[event_type] = counts.get(event_type, 0) + 1
              item = event.get("item")
              if not isinstance(item, dict):
                  continue
              item_type = str(item.get("type") or "unknown")
              item_counts[item_type] = item_counts.get(item_type, 0) + 1
              if event_type != "item.completed" or item_type != "command_execution":
                  continue
              status = str(item.get("status") or "unknown")
              exit_code = item.get("exit_code")
              output = item.get("aggregated_output")
              output_bytes = len(output.encode("utf-8")) if isinstance(output, str) else 0
              command_results.append((status, exit_code, output_bytes))
              if status == "completed" and exit_code == 0 and isinstance(output, str):
                  successful_outputs.append(output)

          print("codex_event_types=" + ",".join(f"{key}:{counts[key]}" for key in sorted(counts)))
          print("codex_item_types=" + ",".join(f"{key}:{item_counts[key]}" for key in sorted(item_counts)))
          for index, (status, exit_code, output_bytes) in enumerate(command_results, start=1):
              print(f"codex_command_result_{index}=status:{status},exit:{exit_code},output_bytes:{output_bytes}")
          print("codex_completed_command_count=" + str(len(command_results)))

          expected_commands = 3 if scope == "codex-long-loop" else 2 if scope == "codex-loop" else 1
          if len(command_results) != expected_commands or len(successful_outputs) != expected_commands:
              raise SystemExit(f"Codex did not complete exactly {expected_commands} successful shell command(s)")

          uuid_pattern = re.compile(r"\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b", re.IGNORECASE)
          match = uuid_pattern.search(successful_outputs[0])
          tool_uuid = match.group(0) if match else None
          print("codex_tool_output_uuid=" + str(tool_uuid is not None).lower())
          if tool_uuid is None:
              raise SystemExit("First successful shell command output contained no UUID proof")

          try:
              final = open(final_path, encoding="utf-8").read()
          except OSError:
              raise SystemExit("Codex produced no final response file")
          print("codex_final_bytes=" + str(len(final.encode("utf-8"))))

          if scope in {"codex-loop", "codex-long-loop"}:
              expected_hash = hashlib.sha256(tool_uuid.encode("utf-8")).hexdigest()
              hash_pattern = re.compile(r"\b[0-9a-f]{64}\b", re.IGNORECASE)
              second_match = hash_pattern.search(successful_outputs[1])
              second_hash = second_match.group(0).lower() if second_match else None
              hash_matches = second_hash == expected_hash
              print("codex_loop_hash_matches_first_tool=" + str(hash_matches).lower())
              if not hash_matches:
                  raise SystemExit("Second shell command output did not contain the SHA-256 digest of the first tool result")

              final_expected = expected_hash
              if scope == "codex-long-loop":
                  third_expected = hashlib.sha256(expected_hash.encode("utf-8")).hexdigest()
                  third_match = hash_pattern.search(successful_outputs[2])
                  third_hash = third_match.group(0).lower() if third_match else None
                  third_matches = third_hash == third_expected
                  print("codex_long_loop_hash_matches_second_tool=" + str(third_matches).lower())
                  if not third_matches:
                      raise SystemExit("Third shell command output did not contain the SHA-256 digest of the second tool result")
                  final_expected = third_expected

              final_matches = final.strip().lower() == final_expected
              print("codex_final_matches_expected_hash=" + str(final_matches).lower())
              if not final_matches:
                  raise SystemExit("Codex final response did not exactly preserve the terminal tool's SHA-256 proof")
          else:
              contains = tool_uuid in final
              print("codex_final_contains_tool_uuid=" + str(contains).lower())
              if not contains:
                  raise SystemExit("Codex final response did not contain the shell command UUID proof")
          PY
          proof_check_status=$?
          set -e

          if [ "$codex_status" -ne 0 ]; then
            exit "$codex_status"
          fi
          if [ "$proof_check_status" -ne 0 ]; then
            exit "$proof_check_status"
          fi

          echo 'codex_responses_streaming=ok'
          echo 'codex_function_call_round_trip=ok'
          if [ "$SCOPE" = 'codex-long-loop' ]; then
            echo 'codex_dependent_three_tool_loop=ok'
            echo 'codex_long_loop_verified=true' >> "$GITHUB_OUTPUT"
          elif [ "$SCOPE" = 'codex-loop' ]; then
            echo 'codex_dependent_two_tool_loop=ok'
            echo 'codex_loop_verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'codex_verified=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Write compatibility summary
        if: ${{ always() }}
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          FALLBACK_MODEL: ${{ inputs.fallback_model }}
          SCOPE: ${{ inputs.scope }}
          CHAT_OUTCOME: ${{ steps.chat.outcome }}
          MODELS_OUTCOME: ${{ steps.models.outcome }}
          MODELS_VERIFIED: ${{ steps.models.outputs.models_verified }}
          RESPONSES_SUPPORTED: ${{ steps.responses.outputs.responses_supported }}
          MESSAGES_SUPPORTED: ${{ steps.messages.outputs.messages_supported }}
          GATEWAY_OUTCOME: ${{ steps.gateway.outcome }}
          RESPONSES_FALLBACK_VERIFIED: ${{ steps.gateway.outputs.responses_fallback_verified }}
          MESSAGES_GATEWAY_OUTCOME: ${{ steps.messages_gateway.outcome }}
          MESSAGES_ADAPTER_VERIFIED: ${{ steps.messages_gateway.outputs.messages_adapter_verified }}
          MESSAGES_VISION_OUTCOME: ${{ steps.messages_vision_gateway.outcome }}
          MESSAGES_VISION_VERIFIED: ${{ steps.messages_vision_gateway.outputs.messages_vision_verified }}
          MESSAGES_STREAM_OUTCOME: ${{ steps.messages_stream_gateway.outcome }}
          MESSAGES_STREAM_VERIFIED: ${{ steps.messages_stream_gateway.outputs.messages_stream_verified }}
          CLAUDE_CODE_OUTCOME: ${{ steps.claude_code.outcome }}
          CLAUDE_CODE_VERIFIED: ${{ steps.claude_code.outputs.claude_code_verified }}
          CLAUDE_CODE_ERROR_VERIFIED: ${{ steps.claude_code.outputs.claude_code_error_verified }}
          CLAUDE_CODE_LOOP_VERIFIED: ${{ steps.claude_code.outputs.claude_code_loop_verified }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          CODEX_VERIFIED: ${{ steps.codex.outputs.codex_verified }}
          CODEX_LOOP_VERIFIED: ${{ steps.codex.outputs.codex_loop_verified }}
          CODEX_LONG_LOOP_VERIFIED: ${{ steps.codex.outputs.codex_long_loop_verified }}
        run: |
          {
            echo '## NVIDIA hosted compatibility probe'
            echo
            echo "- Model: \`${MODEL}\`"
            echo "- Scope: ${SCOPE}"
            if [ "$SCOPE" = 'codex' ]; then
              echo "- Codex CLI 0.147.0 step: ${CODEX_OUTCOME:-not-run}"
              echo "- Codex Responses tool round trip: ${CODEX_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'codex-loop' ]; then
              echo "- Codex CLI 0.147.0 step: ${CODEX_OUTCOME:-not-run}"
              echo "- Codex dependent two-tool Responses loop: ${CODEX_LOOP_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'codex-long-loop' ]; then
              echo "- Codex CLI 0.147.0 step: ${CODEX_OUTCOME:-not-run}"
              echo "- Codex dependent three-tool Responses loop: ${CODEX_LONG_LOOP_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'claude-code' ]; then
              echo "- Claude Code CLI 2.1.226 step: ${CLAUDE_CODE_OUTCOME:-not-run}"
              echo "- Claude Code Messages tool round trip: ${CLAUDE_CODE_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'claude-code-error' ]; then
              echo "- Claude Code CLI 2.1.226 step: ${CLAUDE_CODE_OUTCOME:-not-run}"
              echo "- Claude Code error-result recovery: ${CLAUDE_CODE_ERROR_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'claude-code-loop' ]; then
              echo "- Claude Code CLI 2.1.226 step: ${CLAUDE_CODE_OUTCOME:-not-run}"
              echo "- Claude Code dependent two-tool Messages loop: ${CLAUDE_CODE_LOOP_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'models' ]; then
              echo "- Models discovery step: ${MODELS_OUTCOME:-not-run}"
              echo "- Hosted + AgentInterposer models discovery: ${MODELS_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'responses-fallback' ]; then
              echo "- Requested model: ${MODEL}"
              echo "- Configured fallback model: ${FALLBACK_MODEL:-not-configured}"
              echo "- AgentInterposer Responses fallback step: ${GATEWAY_OUTCOME:-not-run}"
              echo "- Routed simple-text Responses request: ${RESPONSES_FALLBACK_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'responses-structured-fallback' ]; then
              echo "- Requested model: ${MODEL}"
              echo "- Configured fallback model: ${FALLBACK_MODEL:-not-configured}"
              echo "- AgentInterposer structured Responses fallback step: ${GATEWAY_OUTCOME:-not-run}"
              echo "- Routed input_text Responses request: ${RESPONSES_FALLBACK_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'baseline' ]; then
              echo "- Chat Completions baseline: ${CHAT_OUTCOME:-not-run}"
            elif [ "$SCOPE" = 'messages' ]; then
              echo "- AgentInterposer Messages adapter step: ${MESSAGES_GATEWAY_OUTCOME:-not-run}"
              echo "- Messages text + tool round trip: ${MESSAGES_ADAPTER_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'messages-vision' ]; then
              echo "- AgentInterposer Messages vision step: ${MESSAGES_VISION_OUTCOME:-not-run}"
              echo "- Randomized base64 image read: ${MESSAGES_VISION_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'messages-vision-fallback' ]; then
              echo "- Requested model: ${MODEL}"
              echo "- Configured fallback model: ${FALLBACK_MODEL:-not-configured}"
              echo "- AgentInterposer Messages vision fallback step: ${MESSAGES_VISION_OUTCOME:-not-run}"
              echo "- Routed randomized base64 image read: ${MESSAGES_VISION_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'chat-vision-fallback' ]; then
              echo "- Requested model: ${MODEL}"
              echo "- Configured fallback model: ${FALLBACK_MODEL:-not-configured}"
              echo "- AgentInterposer Chat Completions vision fallback step: ${MESSAGES_VISION_OUTCOME:-not-run}"
              echo "- Routed randomized image read: ${MESSAGES_VISION_VERIFIED:-not-verified}"
            elif [ "$SCOPE" = 'messages-stream' ]; then
              echo "- AgentInterposer Messages streaming step: ${MESSAGES_STREAM_OUTCOME:-not-run}"
              echo "- Messages text + tool SSE: ${MESSAGES_STREAM_VERIFIED:-not-verified}"
            else
              echo "- Chat Completions step: ${CHAT_OUTCOME:-not-run}"
              echo "- Responses API: ${RESPONSES_SUPPORTED:-unknown}"
              echo "- Anthropic Messages API: ${MESSAGES_SUPPORTED:-unknown}"
              echo "- AgentInterposer Responses passthrough step: ${GATEWAY_OUTCOME:-not-run}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
