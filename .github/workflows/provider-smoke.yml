                  state["first_event_ms"] = first_event_ms
                  state["forwarded_event_blocks"] = event_count
                  state["upstream_bytes"] = len(payload)
                  state["response_completed_seen"] = "response.completed" in events
                  write_state()

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 11438), Handler)
          ready_path.write_text("ready", encoding="utf-8")
          server.serve_forever()
          PYFRAMED
          buffer_pid=$!

          for _ in {1..50}; do
            if [ -s "$framed_ready" ]; then
              break
            fi
            sleep 0.1
          done
          if [ ! -s "$framed_ready" ]; then
            echo 'Event-framed live diagnostic server did not become ready.' >&2
            exit 1
          fi

          set +e
          timeout --signal=TERM --kill-after=5s 180s \
            env CODEX_HOME="$framed_home" \
            FRAMED_CLIENT_KEY='local-framed-placeholder' \
            "$codex" exec \
              --ephemeral \
              --sandbox read-only \
              --ignore-rules \
              --json \
              "$prompt" >"$framed_jsonl" 2>"$framed_stderr"
          framed_codex_status=$?
          set -e

          kill "$buffer_pid" 2>/dev/null || true
          wait "$buffer_pid" 2>/dev/null || true
          buffer_pid=''
          echo "codex_framed_exit=${framed_codex_status}"

          python3 - "$framed_state" "$framed_response" "$framed_second_request" <<'PYFRAMEDCHECK'
          import json
          import pathlib
          import sys

          state_path, response_path, second_path = map(pathlib.Path, sys.argv[1:])
          if not state_path.is_file():
              raise SystemExit("Event-framed live diagnostic produced no state")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          for key in ("upstream_status", "upstream_headers_ms", "first_event_ms", "upstream_complete_ms", "forwarded_event_blocks", "upstream_bytes", "response_completed_seen", "second_request"):
              if key in state:
                  print(f"codex_framed_{key}={state[key]}")
          if not state.get("upstream_completed"):
              raise SystemExit("Event-framed live NVIDIA request did not complete within the diagnostic window")
          if not state.get("response_completed_seen"):
              raise SystemExit("Event-framed live NVIDIA response had no response.completed event")
          if not second_path.is_file():
              raise SystemExit("Codex sent no second request after event-framed live NVIDIA SSE")

          call_id = None
          for raw in response_path.read_text(encoding="utf-8").splitlines():
              if not raw.startswith("data:"):
                  continue
              value = raw.split(":", 1)[1].strip()
              if value == "[DONE]":
                  continue
              try:
                  event = json.loads(value)
              except Exception:
                  continue
              if event.get("type") != "response.output_item.done":
                  continue
              item = event.get("item")
              if isinstance(item, dict) and item.get("type") == "function_call":
                  call_id = item.get("call_id")
                  break
          if not isinstance(call_id, str) or not call_id:
              raise SystemExit("Event-framed live NVIDIA SSE contained no completed function_call")

          second = json.loads(second_path.read_text(encoding="utf-8"))
          inputs = second.get("input") or []
          outputs = [item for item in inputs if isinstance(item, dict) and item.get("type") == "function_call_output"]
          if not any(item.get("call_id") == call_id for item in outputs):
              raise SystemExit("Event-framed live Codex function_call_output did not match the NVIDIA call_id")
          print("codex_framed_function_call_output=true")
          PYFRAMEDCHECK

          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            env CODEX_HOME="$codex_home" \
            AGENTINTERPOSER_CLIENT_KEY='local-client-placeholder' \
            "$codex" exec \
              --ephemeral \
              --sandbox read-only \
              --ignore-rules \
              --json \
              --output-last-message "$final_message" \
              "$prompt" >"$codex_jsonl" 2>"$codex_stderr"
          codex_status=$?
          set -e

          echo "codex_cli_version=$codex_version"
          echo "codex_exit=$codex_status"
          if [ "$codex_status" -ne 0 ]; then
            echo 'Codex Responses compatibility probe failed.' >&2
            echo "codex_failure_status=$codex_status" >&2
            python3 - "$codex_jsonl" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          counts = {}
          item_counts = {}
          errors = []
          try:
              lines = open(path, encoding="utf-8")
          except OSError:
              lines = []
          for raw in lines:
              try:
                  event = json.loads(raw)
              except Exception:
                  continue
              event_type = str(event.get("type") or "unknown")
              counts[event_type] = counts.get(event_type, 0) + 1
              item = event.get("item")
              if isinstance(item, dict):
                  item_type = str(item.get("type") or "unknown")
                  item_counts[item_type] = item_counts.get(item_type, 0) + 1
                  if item_type == "error":
                      item_message = item.get("message") or item.get("error")
                      if item_message:
                          errors.append(str(item_message)[:240])
              error = event.get("error")
              if isinstance(error, dict):
                  message = error.get("message") or error.get("type")
                  if message:
                      errors.append(str(message)[:240])
              elif error:
                  errors.append(str(error)[:240])
          print("codex_event_types=" + ",".join(f"{key}:{counts[key]}" for key in sorted(counts)), file=sys.stderr)
          print("codex_item_types=" + ",".join(f"{key}:{item_counts[key]}" for key in sorted(item_counts)), file=sys.stderr)
          for message in errors[-3:]:
              print("codex_event_error=" + message, file=sys.stderr)
          PY
            tail -n 20 "$codex_stderr" >&2 || true
            exit "$codex_status"
          fi

          actual="$(tr -d '\r\n' < "$final_message")"
          if [ "$actual" != "$proof" ]; then
            echo 'Codex final response did not match the shell-only proof value.' >&2
            exit 1
          fi

          echo 'codex_responses_streaming=ok'
          echo 'codex_function_call_round_trip=ok'
          echo 'codex_model_metadata=ok'
          echo 'codex_reasoning_request=neutral'
          echo 'codex_verified=true' >> "$GITHUB_OUTPUT"

      - name: Write compatibility summary
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          RESPONSES_SUPPORTED: ${{ steps.responses.outputs.responses_supported }}
          MESSAGES_SUPPORTED: ${{ steps.messages.outputs.messages_supported }}
          CODEX_VERIFIED: ${{ steps.codex.outputs.codex_verified }}
          RESPONSES_TOOL_VERIFIED: ${{ steps.responses_tool.outputs.responses_tool_verified }}
          RESPONSES_TOOL_STREAM_VERIFIED: ${{ steps.responses_tool_stream.outputs.responses_tool_stream_verified }}
        run: |
          {
            echo '## NVIDIA hosted compatibility probe'
            echo
            echo "- Model: \`${MODEL}\`"
            echo '- Chat Completions: supported (required for this workflow to pass)'
            echo "- Responses API: ${RESPONSES_SUPPORTED:-unknown}"
            echo "- Anthropic Messages API: ${MESSAGES_SUPPORTED:-unknown}"
            echo '- AgentInterposer Responses passthrough: verified'
            echo "- Responses function call: ${RESPONSES_TOOL_VERIFIED:-unknown}"
            echo "- Responses streaming function call: ${RESPONSES_TOOL_STREAM_VERIFIED:-unknown}"
            echo "- Codex CLI 0.147.0 Responses tool round trip: ${CODEX_VERIFIED:-unknown}"
            echo '- Codex NVIDIA profile: web search disabled; multi-agent namespace disabled'
          } >> "$GITHUB_STEP_SUMMARY"
