name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve build version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must be semantic-version-like (for example v1.0.0)." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tag commit must be contained in origin/main." >&2
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA:0:12}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="$RUNNER_TEMP/agentinterposer-${os}-${arch}"
            rm -rf "$stage"
            mkdir -p "$stage"
            suffix=""
            if [[ "$os" == "windows" ]]; then suffix=".exe"; fi

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" \
                -o "$stage/agentinterposer${suffix}" ./cmd/agentinterposer

            cp README.md LICENSE "$stage/"
            if [[ "$os" == "windows" ]]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/agentinterposer-${VERSION}-${os}-${arch}.zip" "agentinterposer.exe" README.md LICENSE)
            else
              tar -C "$stage" -czf "dist/agentinterposer-${VERSION}-${os}-${arch}.tar.gz" agentinterposer README.md LICENSE
            fi
          done

          linux_amd64="$RUNNER_TEMP/agentinterposer-linux-amd64/agentinterposer"
          "$linux_amd64" --version | grep -F "agentinterposer ${VERSION} (${GITHUB_SHA})"
          (cd dist && sha256sum agentinterposer-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest release archive provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  provider-baseline:
    name: provider-baseline
    uses: ./.github/workflows/provider-smoke.yml
    with:
      model: nvidia/nemotron-3-super-120b-a12b
      fallback_model: ""
      scope: baseline
    secrets: inherit

  codex-long-loop-certification:
    name: codex-long-loop-certification
    needs: provider-baseline
    uses: ./.github/workflows/provider-smoke.yml
    with:
      model: nvidia/nemotron-3-super-120b-a12b
      fallback_model: ""
      scope: codex-long-loop
    secrets: inherit

  claude-code-loop-certification:
    name: claude-code-loop-certification
    needs: codex-long-loop-certification
    uses: ./.github/workflows/provider-smoke.yml
    with:
      model: nvidia/nemotron-3-super-120b-a12b
      fallback_model: ""
      scope: claude-code-loop
    secrets: inherit

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - verify-and-build
      - provider-baseline
      - codex-long-loop-certification
      - claude-code-loop-certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits \
            --draft

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft=false

      - name: Verify immutable release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          attempts=12
          for attempt in $(seq 1 "$attempts"); do
            if output=$(gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>&1); then
              printf '%s\n' "$output"
              exit 0
            fi
            if [[ "$attempt" -eq "$attempts" ]]; then
              printf '%s\n' "$output" >&2
              echo "Release attestation did not verify after ${attempts} attempts." >&2
              exit 1
            fi
            echo "Release attestation not available yet; retrying (${attempt}/${attempts})."
            sleep 5
          done
