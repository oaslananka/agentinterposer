name: OpenCode Zen Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenCode Zen Chat Completions model ID to probe
        required: true
        default: big-pickle
        type: string

permissions:
  contents: read

jobs:
  authless-model-route:
    name: authless-model-route
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Probe Zen through authless model route
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/agentinterposer-zen"
          gateway_log="$RUNNER_TEMP/agentinterposer-zen.log"
          response_body="$RUNNER_TEMP/agentinterposer-zen-response.json"
          pid=''
          cleanup() {
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f "$binary" "$gateway_log" "$response_body"
          }
          trap cleanup EXIT

          route_json="$(python3 - <<'PY'
          import json
          import os
          print(json.dumps([{
              "model": os.environ["MODEL"],
              "upstream_url": "https://opencode.ai/zen/v1",
          }], separators=(",", ":")))
          PY
          )"

          go build -trimpath -o "$binary" ./cmd/agentinterposer
          AGENTINTERPOSER_ADDR='127.0.0.1:11435' \
            AGENTINTERPOSER_UPSTREAM_URL='http://127.0.0.1:9' \
            AGENTINTERPOSER_UPSTREAM_BEARER_TOKEN='unused-default-placeholder' \
            AGENTINTERPOSER_MODEL_ROUTES="$route_json" \
            AGENTINTERPOSER_MAX_RETRIES='0' \
            "$binary" >"$gateway_log" 2>&1 &
          pid=$!

          ready=false
          for _ in {1..30}; do
            if curl --silent --fail 'http://127.0.0.1:11435/healthz' >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            cat "$gateway_log" >&2
            echo 'AgentInterposer did not become ready for the Zen route probe.' >&2
            exit 1
          fi

          status="$(curl --silent --show-error \
            --max-time 90 \
            --output "$response_body" \
            --write-out '%{http_code}' \
            --request POST \
            'http://127.0.0.1:11435/v1/chat/completions' \
            --header 'Authorization: Bearer client-placeholder' \
            --header 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os; print(json.dumps({"model": os.environ["MODEL"], "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 16, "stream": False}, separators=(",", ":")))')")"
          echo "zen_route_http=${status}"
          if [[ ! "$status" =~ ^2 ]]; then
            python3 - "$response_body" <<'PY'
          import json
          import sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("zen_route_error=non-json-response")
              raise SystemExit(0)
          error = data.get("error")
          if isinstance(error, dict):
              print("zen_route_error=" + str(error.get("message") or error.get("type") or "provider-error")[:240])
          else:
              print("zen_route_error=" + str(data.get("detail") or data.get("title") or "provider-error")[:240])
          PY
            exit 1
          fi

          python3 - "$response_body" "$MODEL" <<'PY'
          import json
          import sys
          path, model = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          if data.get("model") != model:
              raise SystemExit("Zen route response did not report the requested model")
          choices = data.get("choices")
          if not isinstance(choices, list) or not choices:
              raise SystemExit("Zen route response contains no choices")
          print("zen_route_schema=ok")
          PY
